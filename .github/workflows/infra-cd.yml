name: "Infra CD - Terraform Apply"

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'

concurrency:
  group: terraform-dev
  cancel-in-progress: false

permissions:
  contents: read
  # Emite el token federado que consume ARM_USE_OIDC (MEF-ADR-0022). Aca no hay paso de
  # azure/login: Terraform lee por su cuenta ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN, que este
  # scope habilita. Va a nivel de workflow porque el archivo tiene un unico job.
  id-token: write
  issues: write        # requerido para cerrar el issue de infra tras el apply exitoso
  pull-requests: read  # requerido por 'gh api commits/{sha}/pulls' y 'pulls/{num}' (deriva el issue)

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Una sola linea cubre provider Y backend: el provider azurerm detecta solo las
      # ACTIONS_ID_TOKEN_REQUEST_* del runtime de Actions (guia service_principal_oidc) y el
      # backend azurerm expone el mismo use_oidc, asi que el token federado sirve al init con
      # el backend keyless por AAD (use_azuread_auth en providers.tf) y al apply. NO agregar
      # env extra ni un use_oidc en el bloque backend: seria redundante. Sin ARM_CLIENT_SECRET
      # a proposito -- si reaparece, el provider vuelve a autenticar por secret (MEF-ADR-0022).
      ARM_USE_OIDC: true
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_postgresql_admin_password: ${{ secrets.POSTGRESQL_ADMIN_PASSWORD }}
      # Gateway APIM (MEF-ADR-0032, issue #335): ninguno de los dos es sensible -- workos_client_id
      # es un identificador publico (MEF-ADR-0032 seccion 6) y cors_allowed_origins son URLs
      # publicas del SPA -- por eso van como GitHub "variables" (vars.*), no secrets.
      # CORS_ALLOWED_ORIGINS se declara como JSON list (ej. '["http://localhost:5173"]'):
      # Terraform decodifica TF_VAR_<x> segun el type constraint de la variable (list(string)).
      TF_VAR_workos_client_id: ${{ vars.WORKOS_CLIENT_ID }}
      TF_VAR_cors_allowed_origins: ${{ vars.CORS_ALLOWED_ORIGINS }}
      # PRM compartido de los servidores MCP (issue #575, Mefisto Paso 3c.3): dominio AuthKit del
      # entorno, publico (MEF-ADR-0032 seccion 6) -- GitHub "variable", no secret. Requiere que el
      # operador corra `gh variable set WORKOS_AUTHORIZATION_SERVER_URL --body "https://<dominio>.authkit.app"`
      # antes de mergear (paso manual del issue #575); sin esto, terraform apply falla por
      # variable requerida faltante (apim-mcp-prm.tf no le da default).
      TF_VAR_mcp_authorization_server_url: ${{ vars.WORKOS_AUTHORIZATION_SERVER_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          # Pinneado a lo que CI ya instalaba via `latest` (issue #303), no a la version local.
          # Sin este pin, plan (PR) y apply (merge) son dos instalaciones independientes en
          # momentos distintos: un release de Terraform entremedio corre el apply con un CLI
          # que nadie uso en el plan. Bump deliberado en su propio PR, igual que el lock file
          # del provider (#301), y SIEMPRE en los dos workflows a la vez: subirlo solo aca deja
          # el plan de infra-ci.yml en otra version y reintroduce la divergencia que el pin cierra.
          terraform_version: "1.15.8"

      - name: Terraform Init
        working-directory: infra/environments/dev
        run: terraform init

      - name: Terraform Plan
        working-directory: infra/environments/dev
        run: terraform plan -no-color -lock-timeout=5m

      - name: Terraform Apply
        working-directory: infra/environments/dev
        run: terraform apply -auto-approve -lock-timeout=5m

      - name: Cerrar el issue de infra tras el apply exitoso
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # El PR del pipeline IaC NO lleva 'Closes #N' (MEF-ADR-0022, "Cierre del issue de
          # infra: al aplicar en CI, no al mergear el PR"): el issue representa "infra
          # aplicada", no "infra mergeada". El numero de issue se deriva de la rama
          # infra-issue-<num>-<slug> (scripts/iac-pipeline.sh) del PR que se acaba de
          # mergear, via la API de PRs asociados al commit de merge -- funciona con
          # squash, merge o rebase, a diferencia de parsear el mensaje del commit.
          PR_NUM=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number // empty')
          if [ -z "$PR_NUM" ]; then
            echo "No se encontro un PR asociado al commit ${{ github.sha }}; no se cierra ningun issue."
            exit 0
          fi
          BRANCH=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUM}" --jq '.head.ref // empty')
          ISSUE_NUM=$(echo "$BRANCH" | grep -oE 'infra-issue-[0-9]+' | grep -oE '[0-9]+' || true)
          if [ -z "$ISSUE_NUM" ]; then
            echo "La rama '$BRANCH' del PR #$PR_NUM no sigue el patron infra-issue-<num>-*; no se cierra ningun issue."
            exit 0
          fi
          gh issue close "$ISSUE_NUM" \
            --comment "Infraestructura aplicada por CI (workflow **Infra CD**, run ${{ github.run_id }}, commit ${{ github.sha }})."
