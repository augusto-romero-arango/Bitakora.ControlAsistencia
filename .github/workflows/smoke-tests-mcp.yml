name: Smoke Tests (MCP)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL base de la Function App MCP'
        required: false
        default: 'https://func-asist-dev-mcp-asistente.azurewebsites.net'
      test_project:
        description: 'Ruta al proyecto de smoke tests'
        required: false
        default: 'tests/Bitakora.ControlAsistencia.Mcp.Asistente.SmokeTests/'
      app_name:
        description: 'Nombre de la Function App (para listar la key mcp_extension)'
        required: false
        default: 'func-asist-dev-mcp-asistente'
      resource_group:
        description: 'Resource group de la Function App'
        required: false
        default: 'rg-controlasistencias-dev'
      expected_sha:
        description: 'SHA de commit esperado en /api/version (vacio = solo esperar /api/ready 200)'
        required: false
        default: ''
  workflow_call:
    inputs:
      base_url:
        type: string
        required: false
        default: 'https://func-asist-dev-mcp-asistente.azurewebsites.net'
      test_project:
        type: string
        required: false
        default: 'tests/Bitakora.ControlAsistencia.Mcp.Asistente.SmokeTests/'
      app_name:
        type: string
        required: false
        default: 'func-asist-dev-mcp-asistente'
      resource_group:
        type: string
        required: false
        default: 'rg-controlasistencias-dev'
      expected_sha:
        type: string
        required: false
        default: ''
    secrets:
      # Los tres del OIDC de MEF-ADR-0022 -- los mismos que usa el job deploy del caller, cero
      # secrets nuevos. Se necesitan aqui porque la key mcp_extension NO se versiona (doctrina del
      # issue #509): se obtiene en runtime con 'az functionapp keys list'.
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

# Esta suite entra al grupo de concurrencia 'smoke-tests-dev' de smoke-tests-dominio.yml (issue
# #1023; antes quedaba fuera por la decision 1 del refinamiento del issue #516, cuando era solo
# lectura). Ahora tiene fase de siembra e2e ([TEST] + polling via MCP): sus escrituras publican a
# los topics de dev (p. ej. 'DiaDepurado' en 'dia-depurado') que consumen las suites de dominio
# por la unica suscripcion 'smoke-tests'. Corriendo a la vez, la suite de dominio recibe mensajes
# ajenos y falla (push 2026-10-13 22:01, runs 38474825652 y 38474825774).
#
# Mismo grupo, no uno propio: el recurso en disputa es esa suscripcion y la comparten todas las
# suites. El nombre es un literal fijo (nunca ${{ github.workflow }}: un workflow llamado hereda
# el nombre del caller y daria un grupo distinto por invocador). cancel-in-progress: false para no
# cancelar el smoke que verifica un deploy en curso; 'queue: max' porque con 'single' la tercera
# corrida en llegar cancelaria a la que espera (un push a PublicEvents/PrivateEvents dispara
# varios deploys a la vez). Detalle en smoke-tests-dominio.yml.
#
# OJO si corres actionlint local: hasta 1.7.12 no conoce 'queue' y lo reporta como clave
# inesperada. Es atraso del linter, no un error; no borres la linea por ese hallazgo.
concurrency:
  group: smoke-tests-dev
  cancel-in-progress: false
  queue: max

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    permissions:
      # Declarar 'permissions' pone en 'none' todo scope no listado; 'contents: read' es
      # obligatorio para que actions/checkout siga clonando.
      contents: read
      # Emite el token federado que azure/login canjea por OIDC (MEF-ADR-0022). OJO: un workflow
      # llamado no puede exceder los permisos del invocador -- el job del caller que hace 'uses'
      # de este reusable tambien debe conceder 'id-token: write' (misma trampa ya documentada para
      # 'actions: read' en deploy-programacion.yml, run 31516294884).
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Duplica a proposito el warmup version+ready de smoke-tests-dominio.yml (MEF-ADR-0018,
      # Rule of Three: esta es la segunda aparicion; con un unico servidor MCP en el BC,
      # Mcp.Asistente, la tercera no llega por esta via). Extender el reusable de dominios contaminaria con permisos OIDC y ramas MCP a un
      # workflow que 4 invocadores usan sin eso. Diferencia deliberada con el de dominios: el
      # fallback con expected_sha vacio espera /api/ready y no /api/health -- este app no expone
      # /api/health, y su ready es trivial "worker arriba" (no abre event store: es cliente HTTP
      # puro, ver ReadyCheck.cs).
      - name: Warmup Function App
        run: |
          expected_sha="${{ inputs.expected_sha }}"
          if [ -n "$expected_sha" ]; then
            # MEF-ADR-0031 seccion 3 (enmienda 2026-09-12, run 34722573915): 230s del
            # WEBSITES_CONTAINER_START_TIME_LIMIT + ~95s de teardown/reinicio + 92s del peor
            # swap sano = ~417s, redondeados a 420s. NO fallar rapido ante el primer arranque
            # fallido: App Service reintenta el mismo artefacto; mas de un reintento sale rojo.
            echo "Esperando que ${{ inputs.base_url }}/api/version reporte el SHA ${expected_sha}..."
            TIMEOUT_VERSION=420
            INTERVALO_VERSION=5
            inicio_version=$SECONDS
            intento=0
            ultimo_cuerpo=""
            version_ok=0
            while true; do
              restante=$((TIMEOUT_VERSION - (SECONDS - inicio_version)))
              if [ "$restante" -le 0 ]; then
                break
              fi
              max_time=$((restante < 15 ? restante : 15))
              intento=$((intento + 1))
              body=$(curl -s --max-time "$max_time" "${{ inputs.base_url }}/api/version" || echo "")
              ultimo_cuerpo="$body"
              if [[ "$body" == *"$expected_sha"* ]]; then
                echo "Version OK tras ${intento} intento(s) ($((SECONDS - inicio_version))s): ${body}"
                version_ok=1
                break
              fi
              restante=$((TIMEOUT_VERSION - (SECONDS - inicio_version)))
              if [ "$restante" -le 0 ]; then
                break
              fi
              espera=$((restante < INTERVALO_VERSION ? restante : INTERVALO_VERSION))
              echo "Intento ${intento}: version desplegada '${body}' no coincide con '${expected_sha}'. Reintentando en ${espera}s..."
              sleep "$espera"
            done
            if [ "$version_ok" -eq 0 ]; then
              app_name="${{ inputs.base_url }}"
              app_name="${app_name#https://}"
              app_name="${app_name%%/*}"
              app_name="${app_name%.azurewebsites.net}"
              startup_logs_url="https://${app_name}.scm.azurewebsites.net/api/vfs/LogFiles/StartupLogs/"
              echo "Timeout: /api/version no reporto el SHA esperado (${expected_sha}) en 420s. Ultimo cuerpo observado: '${ultimo_cuerpo}'. StartupLogs de Kudu: ${startup_logs_url}"
              exit 1
            fi
          fi

          echo "Esperando que ${{ inputs.base_url }}/api/ready responda 200..."
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${{ inputs.base_url }}/api/ready" || echo "000")
            if [ "$code" = "200" ]; then
              echo "Ready OK tras ${i} intento(s) (~$((i*2))s)."
              exit 0
            fi
            echo "Intento ${i}: /api/ready respondio HTTP ${code}. Reintentando en 2s..."
            sleep 2
          done
          echo "Timeout: /api/ready no respondio 200 en 120s"
          exit 1

      - name: Azure Authentication
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # La key mcp_extension no se versiona ni vive como GitHub secret (rotacion manual y copia
      # persistida contradicen la doctrina del issue #509): se lista en runtime con el mismo SP
      # del deploy (Contributor incluye Microsoft.Web/sites/host/listkeys/action) y se enmascara
      # ANTES de exportarla para que ningun log posterior la muestre.
      - name: Obtener la key mcp_extension
        env:
          APP_NAME: ${{ inputs.app_name }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
        run: |
          key=$(az functionapp keys list \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --query systemKeys.mcp_extension -o tsv)
          if [ -z "$key" ]; then
            echo "::error::La app ${APP_NAME} no expone la system key mcp_extension."
            exit 1
          fi
          echo "::add-mask::$key"
          echo "MCP_FUNCTIONS_KEY=$key" >> "$GITHUB_ENV"

      - name: Smoke tests
        env:
          Mcp__BaseUrl: ${{ inputs.base_url }}
          Mcp__FunctionsKey: ${{ env.MCP_FUNCTIONS_KEY }}
        run: dotnet test --project ${{ inputs.test_project }} --configuration Release
