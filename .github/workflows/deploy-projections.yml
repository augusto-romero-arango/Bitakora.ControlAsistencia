# Publica la imagen del worker de proyecciones (Bitakora.ControlAsistencia.Projections)
# en el ACR de dev y actualiza el Container App para que la ejecute (issue #236).
#
# Restricciones operativas (MEF-ADR-0034 seccion 8), verificadas antes de disenar este workflow:
#   1. Orden frente al sembrado de secretos: la imagen real solo debe desplegarse DESPUES
#      de que infra-cd.yml haya sembrado el secreto `marten-connection` en el Key Vault al
#      menos una vez. Con el placeholder es inocuo que la Key Vault reference nazca sin
#      resolver; con el worker real, arrancar sin la cadena de conexion es un fallo.
#   2. Una revision viva no re-lee un secreto rotado: cambiar el valor de un secreto no se
#      propaga a las revisiones en ejecucion. Por eso cada imagen se etiqueta con el SHA del
#      commit: un tag nuevo siempre crea una revision nueva (revision-scope change segun
#      "Revisions in Azure Container Apps" de Microsoft Learn), lo que garantiza que el
#      contenedor arranque de cero y lea el secreto vigente.
#
# Rollback de imagen: la imagen NO la gobierna Terraform (issue #249 le puso
# `lifecycle { ignore_changes = [template[0].container[0].image] }` al Container App), asi que
# revertir jamas se hace tocando HCL ni corriendo `terraform apply`. Se hace re-publicando el
# tag anterior:
#   az containerapp update -n ca-asist-dev -g rg-controlasistencias-dev --image <loginServer>/<repo>:<sha-anterior>
# El tag por SHA sigue en el ACR, asi que este comando no necesita reconstruir nada.
# `az containerapp revision activate` NO es un camino de rollback valido aqui: el Container App
# corre en revision_mode = "Single" (infra/modules/container-app), y en ese modo solo una
# revision puede estar activa a la vez y las viejas se desaprovisionan automaticamente
# (Microsoft Learn, "Update and deploy changes in Azure Container Apps" -- Revision modes:
# "New revisions are automatically provisioned, activated, and scaled ... Old revisions are
# automatically deprovisioned"). Activar/desactivar revisiones a mano requiere pasar antes a
# modo multiple con `az containerapp revision set-mode --mode multiple`.

name: Deploy Projections

on:
  push:
    branches: [main]
    # El filtro debe cubrir todo lo que determina la imagen construida, no solo el codigo del
    # worker. El Dockerfile hace `COPY . .` con el contexto en la raiz del repo y compila
    # dentro del contenedor, asi que `global.json` decide que SDK resuelve ese build: un
    # cambio ahi puede romper o alterar la imagen sin tocar ningun .cs. Y el workflow se
    # incluye a si mismo para que una correccion a este archivo se despliegue sola.
    #
    # Deliberadamente FUERA del filtro (no agregar por simetria con los deploy-*.yml del
    # write-side):
    #   - ControlAsistencias.slnx      -> el Dockerfile compila el .csproj directo, no la solucion.
    #   - tests/...Projections.Tests/  -> un cambio de tests no altera la imagen, y cada
    #                                     publicacion crea una revision nueva que reinicia el daemon.
    #   - infra/environments/dev/      -> tras el issue #249 Terraform ya no gobierna la imagen
    #                                     (`ignore_changes`), asi que un cambio de infra no
    #                                     requiere republicarla.
    paths:
      - 'src/Bitakora.ControlAsistencia.Projections/**'
      - 'src/Bitakora.ControlAsistencia.ReadModels/**'
      # Issue #237: el worker compila contra los dos DomainEvents para ver los tipos de evento que
      # proyecta y su ConfigurarSerializacion (MEF-ADR-0034 seccion 5), y contra Public/PrivateEvents
      # por transitividad. Un cambio en cualquiera de los cuatro cambia su binario, asi que sin estas
      # rutas el worker quedaria desplegado con una version vieja de los tipos que deserializa.
      - 'src/Bitakora.ControlAsistencia.Programacion.DomainEvents/**'
      - 'src/Bitakora.ControlAsistencia.ControlHoras.DomainEvents/**'
      - 'src/Bitakora.ControlAsistencia.PrivateEvents/**'
      - 'src/Bitakora.ControlAsistencia.PublicEvents/**'
      - 'global.json'
      - '.github/workflows/deploy-projections.yml'
  workflow_dispatch:

env:
  RESOURCE_GROUP: rg-controlasistencias-dev
  CONTAINER_APP_NAME: ca-asist-dev
  IMAGE_REPOSITORY: projections

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ControlAsistencias.slnx

      - name: Build
        run: dotnet build ControlAsistencias.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --project tests/Bitakora.ControlAsistencia.Projections.Tests/ --no-build --configuration Release --ignore-exit-code 8

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      # Declarar 'permissions' a nivel de job pone en 'none' todo scope que no se liste, asi
      # que 'contents: read' es obligatorio para que actions/checkout siga clonando.
      contents: read
      # Emite el token federado que azure/login canjea por OIDC, sin client secret
      # (MEF-ADR-0022). Basta para los pasos de 'az' y 'docker push' de abajo: van contra el
      # ACR (plano de Azure), no contra la API de GitHub ni contra GHCR.
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Azure Authentication
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolver el ACR del resource group
        run: |
          # El nombre del ACR lleva un sufijo aleatorio (random_string.container_registry_suffix),
          # asi que no se puede fijar en el workflow: se resuelve en tiempo de ejecucion. Se leen
          # los dos datos de la misma consulta porque `az acr login` quiere el nombre del recurso
          # y no el login server FQDN (Microsoft Learn, "Quickstart: Create a private container
          # registry using the Azure CLI": "Specify only the registry resource name when logging
          # in with the Azure CLI. Don't use the fully qualified login server name"), mientras que
          # el tag de la imagen si necesita el login server.
          acr=$(az acr list -g "${{ env.RESOURCE_GROUP }}" \
            --query "[0].{name: name, loginServer: loginServer}" -o json)

          acr_name=$(jq -r '.name // empty' <<< "$acr")
          login_server=$(jq -r '.loginServer // empty' <<< "$acr")

          if [ -z "$acr_name" ] || [ -z "$login_server" ]; then
            echo "No se encontro ningun Container Registry en ${{ env.RESOURCE_GROUP }}"
            exit 1
          fi

          echo "acr_name=${acr_name}" >> "$GITHUB_ENV"
          echo "login_server=${login_server}" >> "$GITHUB_ENV"

      - name: ACR login
        run: az acr login --name "${{ env.acr_name }}"

      - name: Build y push de la imagen
        run: |
          image="${{ env.login_server }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}"
          docker build -f src/Bitakora.ControlAsistencia.Projections/Dockerfile -t "$image" .
          docker push "$image"
          echo "image=${image}" >> "$GITHUB_ENV"

      - name: Actualizar Container App
        run: |
          az containerapp update \
            -n "${{ env.CONTAINER_APP_NAME }}" \
            -g "${{ env.RESOURCE_GROUP }}" \
            --image "${{ env.image }}"

      - name: Verificar la revision activa
        run: |
          # La verificacion se hace sobre la REVISION, no solo sobre el template del Container
          # App: el template devuelve lo que acabamos de escribir con `update` (comprobarlo ahi
          # seria una tautologia), mientras que la revision demuestra que Azure aprovisiono una
          # revision nueva corriendo la imagen publicada. En revision_mode = "Single" la
          # revision mas nueva es la unica activa, asi que latestRevisionName ES la que corre.
          revision=$(az containerapp show \
            -n "${{ env.CONTAINER_APP_NAME }}" \
            -g "${{ env.RESOURCE_GROUP }}" \
            --query "properties.latestRevisionName" -o tsv)

          if [ -z "$revision" ]; then
            echo "El Container App no reporta ninguna revision (properties.latestRevisionName vacio)"
            exit 1
          fi

          revision_json=$(az containerapp revision show \
            -n "${{ env.CONTAINER_APP_NAME }}" \
            -g "${{ env.RESOURCE_GROUP }}" \
            --revision "$revision" -o json)

          revision_image=$(jq -r '.properties.template.containers[0].image' <<< "$revision_json")
          revision_activa=$(jq -r '.properties.active' <<< "$revision_json")

          echo "Revision:  ${revision}"
          echo "Imagen:    ${revision_image}"
          echo "Activa:    ${revision_activa}"
          echo "Provision: $(jq -r '.properties.provisioningState // "sin reportar"' <<< "$revision_json")"
          echo "Ejecucion: $(jq -r '.properties.runningState // "sin reportar"' <<< "$revision_json")"

          # El placeholder se comprueba aparte de la igualdad: si alguien re-aplicara Terraform
          # sin el ignore_changes de #249, este mensaje dice exactamente que paso en vez de un
          # generico "no coincide".
          if [[ "$revision_image" == *"mcr.microsoft.com/k8se/quickstart"* ]]; then
            echo "La revision activa sigue corriendo el placeholder de demostracion"
            exit 1
          fi

          if [ "$revision_image" != "${{ env.image }}" ]; then
            echo "La imagen de la revision activa no coincide con la publicada (${{ env.image }})"
            exit 1
          fi

          if [ "$revision_activa" != "true" ]; then
            echo "La revision mas nueva (${revision}) no quedo activa"
            exit 1
          fi

          # Nota operativa: un fallo de arranque del worker (secreto sin resolver, credenciales
          # de Postgres, permisos DDL sobre el schema) NO lo detecta este job -- la revision se
          # aprovisiona igual. Verlo requiere los logs del contenedor:
          #   az containerapp logs show -n ca-asist-dev -g rg-controlasistencias-dev --follow

  smoke-tests:
    # (issue #314) 'Verificar la revision activa' comprueba el CONTRATO DE DESPLIEGUE -- que la
    # revision mas nueva corre exactamente la imagen que este run publico y quedo activa --, no que
    # las proyecciones sigan materializando lo que los GET de lectura esperan. provisioningState y
    # runningState ni siquiera se afirman ahi: se imprimen como informacion. La nota final de ese
    # paso lo dice sin rodeos: un fallo de arranque del worker (secreto sin resolver, credenciales
    # de Postgres, permisos DDL) NO lo detecta, porque la revision se aprovisiona igual. Este job
    # cierra ese hueco ejerciendo los GET de verdad (CA-1).
    #
    # 'needs: deploy' (CA-3) lo pone DESPUES del deploy, nunca en paralelo; y si 'deploy' falla o
    # queda saltado, un job cuyo 'needs' no se cumplio no arranca, asi que la suite no corre sin
    # motivo (CA-4) sin necesidad de un 'if' explicito. Ojo con la diferencia frente a
    # deploy-control-horas.yml: aqui 'deploy' no tiene guarda 'if' propia. El push que no toca el
    # worker se filtra antes, en el 'paths' de arriba, y en ese caso no arranca el workflow entero.
    needs: deploy
    uses: ./.github/workflows/smoke-tests-dominio.yml
    with:
      # ControlHoras es hoy el unico dominio con proyecciones CONCRETAS: los unicos
      # 'opts.Projections.Add<>' del worker viven en
      # src/Bitakora.ControlAsistencia.Projections/Infraestructura/ConfiguracionMartenProjectionsControlHoras.cs.
      # Ese es el archivo a revisar cuando esta eleccion se ponga en duda, NO Program.cs: Program.cs
      # solo llama ConfigurarEventos, que registra el named store y el daemon de los DOS dominios
      # -- el de Programacion existe y arranca, pero todavia no materializa nada. Asi que la suite
      # de ControlHoras cubre todo lo que este worker proyecta.
      #
      # Desviacion documentada frente a la propuesta del issue de reusar
      # .github/smoke-tests-dominios.json (la matriz de "todos los dominios" que consume
      # smoke-tests.yml): esa matriz incluye tambien Programacion, cuya suite probaria un dominio
      # sin ninguna proyeccion detras de este deploy. Cuando Programacion registre su primera
      # proyeccion, este job deberia migrar a esa matriz para no mantener dos listas del mismo
      # hecho en paralelo.
      base_url: https://func-asist-dev-control-horas.azurewebsites.net
      test_project: tests/Bitakora.ControlAsistencia.ControlHoras.SmokeTests/
      # expected_sha vacio a proposito (CA-2): /api/version lo expone el Function App de
      # ControlHoras, no el worker de proyecciones -- un deploy de este worker no cambia ese
      # valor, asi que esperar un SHA aca solo agotaria el timeout de 120s sin motivo. El
      # reusable ya degrada a esperar HTTP 200 en /api/health cuando expected_sha llega vacio.
      #
      # Consecuencia a vigilar (la carrera worker/consulta que anticipa el issue): ese health check
      # pega contra el Function App, que este run NO redespliega, asi que responde 200 casi de
      # inmediato y no le da margen a la revision nueva del worker para tomar el advisory lock de
      # HotCold que la anterior esta liberando. El margen real lo pone el presupuesto de Polling de
      # los tests que consultan turnos -- 30s, el campo 'Timeout' de ObtenerTurnoVigenteSmokeTests
      # y ListarTurnosVigentesSmokeTests. Si este job sale intermitente, ese es el primer numero a
      # mirar, antes de sospechar de la suite o del deploy.
      expected_sha: ''
    secrets:
      SERVICEBUS_CONNECTION_STRING: ${{ secrets.SERVICEBUS_CONNECTION_STRING }}
      POSTGRES_CONNECTION_STRING: ${{ secrets.POSTGRES_CONNECTION_STRING }}
