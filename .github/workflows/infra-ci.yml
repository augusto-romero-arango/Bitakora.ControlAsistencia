name: "Infra CI - Terraform Plan"

on:
  pull_request:
    paths:
      - 'infra/**'

concurrency:
  group: terraform-dev
  cancel-in-progress: true

permissions:
  contents: read
  # Requerido por el paso de github-script que publica el plan como comentario del PR.
  pull-requests: write
  # Emite el token federado que consume ARM_USE_OIDC (MEF-ADR-0022). Aca no hay paso de
  # azure/login: Terraform lee por su cuenta ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN, que este
  # scope habilita. Va a nivel de workflow porque el archivo tiene un unico job.
  id-token: write

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Una sola linea cubre provider Y backend: el provider azurerm detecta solo las
      # ACTIONS_ID_TOKEN_REQUEST_* del runtime de Actions (guia service_principal_oidc) y el
      # backend azurerm expone el mismo use_oidc, asi que el token federado sirve al init con
      # el backend keyless por AAD (use_azuread_auth en providers.tf) y al plan. NO agregar
      # env extra ni un use_oidc en el bloque backend: seria redundante. Sin ARM_CLIENT_SECRET
      # a proposito -- si reaparece, el provider vuelve a autenticar por secret (MEF-ADR-0022).
      ARM_USE_OIDC: true
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_postgresql_admin_password: ${{ secrets.POSTGRESQL_ADMIN_PASSWORD }}
      # Gateway APIM (MEF-ADR-0032, issue #335): mismo par que infra-cd.yml -- sin estas dos,
      # 'terraform plan' del PR falla por variable requerida faltante (workos_client_id y
      # cors_allowed_origins no tienen default en apim.tf). Ninguno de los dos es sensible
      # (MEF-ADR-0032 seccion 6), por eso van como GitHub "variables" (vars.*), no secrets.
      TF_VAR_workos_client_id: ${{ vars.WORKOS_CLIENT_ID }}
      TF_VAR_cors_allowed_origins: ${{ vars.CORS_ALLOWED_ORIGINS }}
      # PRM compartido de los servidores MCP (issue #575, Mefisto Paso 3c.3): mismo par que
      # infra-cd.yml -- sin esta, 'terraform plan' del PR falla por variable requerida faltante
      # (apim-mcp-prm.tf no le da default). Publico, no secreto (MEF-ADR-0032 seccion 6).
      TF_VAR_mcp_authorization_server_url: ${{ vars.WORKOS_AUTHORIZATION_SERVER_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          # Pinneado a lo que CI ya instalaba via `latest` (issue #303), no a la version local.
          # Sin este pin, plan (PR) y apply (merge) son dos instalaciones independientes en
          # momentos distintos: un release de Terraform entremedio corre el apply con un CLI
          # que nadie uso en el plan. Bump deliberado en su propio PR, igual que el lock file
          # del provider (#301), y SIEMPRE en los dos workflows a la vez: subirlo solo aca deja
          # el apply de infra-cd.yml en otra version y reintroduce la divergencia que el pin cierra.
          terraform_version: "1.15.8"

      - name: Terraform Init
        working-directory: infra/environments/dev
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: infra/environments/dev
        run: terraform plan -no-color -lock-timeout=5m 2>&1 | tee /tmp/plan_output.txt
        continue-on-error: true

      - name: Comentar plan en PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('/tmp/plan_output.txt', 'utf8');
            const planStatus = '${{ steps.plan.outcome }}';
            const statusIcon = planStatus === 'success' ? '✅' : '❌';
            const statusText = planStatus === 'success' ? 'exitoso' : 'fallido';

            const body = `### ${statusIcon} Terraform Plan — \`dev\` (${statusText})

            <details>
            <summary>Ver output del plan</summary>

            \`\`\`
            ${planOutput}
            \`\`\`
            </details>

            *Ejecutado en commit ${{ github.sha }}*`;

            const marker = '<!-- terraform-plan-comment -->';
            const fullBody = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

      - name: Fallar si el plan fallo
        if: steps.plan.outcome == 'failure'
        run: exit 1
