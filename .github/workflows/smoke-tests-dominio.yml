name: Smoke Tests (dominio)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL base de la Function App'
        required: false
        default: 'https://func-asist-dev-programacion.azurewebsites.net'
      test_project:
        description: 'Ruta al proyecto de smoke tests'
        required: false
        default: 'tests/Bitakora.ControlAsistencia.Programacion.SmokeTests/'
      expected_sha:
        description: 'SHA de commit esperado en /api/version (vacio = solo esperar HTTP 200)'
        required: false
        default: ''
  workflow_call:
    inputs:
      base_url:
        type: string
        required: false
        default: 'https://func-asist-dev-programacion.azurewebsites.net'
      test_project:
        type: string
        required: false
        default: 'tests/Bitakora.ControlAsistencia.Programacion.SmokeTests/'
      expected_sha:
        type: string
        required: false
        default: ''
    secrets:
      SERVICEBUS_CONNECTION_STRING:
        required: false
      POSTGRES_CONNECTION_STRING:
        required: false

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Warmup Function App
        run: |
          expected_sha="${{ inputs.expected_sha }}"
          if [ -n "$expected_sha" ]; then
            echo "Esperando que ${{ inputs.base_url }}/api/version reporte el SHA ${expected_sha}..."
            for i in $(seq 1 60); do
              body=$(curl -s "${{ inputs.base_url }}/api/version" || echo "")
              if [[ "$body" == *"$expected_sha"* ]]; then
                echo "Version OK tras ${i} intento(s) (~$((i*2))s): ${body}"
                exit 0
              fi
              echo "Intento ${i}: version desplegada '${body}' no coincide con '${expected_sha}'. Reintentando en 2s..."
              sleep 2
            done
            echo "Timeout: /api/version no reporto el SHA esperado (${expected_sha}) en 120s"
            exit 1
          fi

          echo "expected_sha vacio: degradando a chequeo simple de HTTP 200."
          echo "Esperando health endpoint en ${{ inputs.base_url }}/api/health..."
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ inputs.base_url }}/api/health" || echo "000")
            if [ "$code" = "200" ]; then
              echo "Health OK tras ${i} intento(s) (~$((i*2))s)."
              exit 0
            fi
            echo "Intento ${i}: HTTP ${code}. Reintentando en 2s..."
            sleep 2
          done
          echo "Timeout: health endpoint no respondio 200 en 120s"
          exit 1

      - name: Smoke tests
        env:
          Api__BaseUrl: ${{ inputs.base_url }}
          ServiceBus__ConnectionString: ${{ secrets.SERVICEBUS_CONNECTION_STRING }}
          Postgres__ConnectionString: ${{ secrets.POSTGRES_CONNECTION_STRING }}
        run: dotnet test --project ${{ inputs.test_project }} --configuration Release
