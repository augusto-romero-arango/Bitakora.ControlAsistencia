name: Smoke Tests (dominio)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL base de la Function App'
        required: false
        default: 'https://func-asist-dev-programacion.azurewebsites.net'
      test_project:
        description: 'Ruta al proyecto de smoke tests'
        required: false
        default: 'tests/Bitakora.ControlAsistencia.Programacion.SmokeTests/'
      expected_sha:
        description: 'SHA de commit esperado en /api/version (vacio = solo esperar HTTP 200)'
        required: false
        default: ''
  workflow_call:
    inputs:
      base_url:
        type: string
        required: false
        default: 'https://func-asist-dev-programacion.azurewebsites.net'
      test_project:
        type: string
        required: false
        default: 'tests/Bitakora.ControlAsistencia.Programacion.SmokeTests/'
      expected_sha:
        type: string
        required: false
        default: ''
    secrets:
      SERVICEBUS_CONNECTION_STRING:
        required: false
      POSTGRES_CONNECTION_STRING:
        required: false

# Serializa las tres rutas que invocan este reusable (deploy-control-horas.yml,
# deploy-programacion.yml y la matrix de smoke-tests.yml) contra el mismo Service Bus de dev y su
# unica suscripcion 'smoke-tests' -- issue #313. Dos suites corriendo a la vez se roban
# mutuamente el mensaje que cada una espera (cada CompleteMessageAsync de una destruye el
# mensaje que la otra necesitaba).
#
# El grupo va AQUI, a nivel de ESTE workflow llamado, y no como jobs.<job_id>.concurrency en el
# job 'uses:' de cada caller: la documentacion de GitHub Actions sobre reusable workflows solo
# lista jobs.<job_id>.concurrency como valido en el job que hace la llamada, pero la comunidad
# (github/community#30708) confirma que ese punto no serializa invocaciones del reusable como
# cabria esperar -- lo que si funciona es declarar 'concurrency' en el propio workflow llamado.
#
# El nombre del grupo es un literal fijo a proposito: un workflow llamado hereda
# ${{ github.workflow }} del CALLER (Deploy ControlHoras, Deploy Programacion o Smoke Tests
# (todos los dominios)), asi que interpolarlo aca produciria un grupo distinto por invocador y
# anularia la serializacion que este cambio busca.
#
# cancel-in-progress: false (CA-3) -- una corrida encolada espera a la que esta verificando un
# deploy en curso, nunca la cancela. Con 2 invocadores simultaneos como maximo hoy, el default de
# 'queue' (una corrida pendiente por grupo) alcanza; si se suma un tercer invocador (#314), revisar
# 'queue: max'.
concurrency:
  group: smoke-tests-dev
  cancel-in-progress: false

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Warmup Function App
        run: |
          expected_sha="${{ inputs.expected_sha }}"
          if [ -n "$expected_sha" ]; then
            echo "Esperando que ${{ inputs.base_url }}/api/version reporte el SHA ${expected_sha}..."
            for i in $(seq 1 60); do
              body=$(curl -s "${{ inputs.base_url }}/api/version" || echo "")
              if [[ "$body" == *"$expected_sha"* ]]; then
                echo "Version OK tras ${i} intento(s) (~$((i*2))s): ${body}"
                exit 0
              fi
              echo "Intento ${i}: version desplegada '${body}' no coincide con '${expected_sha}'. Reintentando en 2s..."
              sleep 2
            done
            echo "Timeout: /api/version no reporto el SHA esperado (${expected_sha}) en 120s"
            exit 1
          fi

          echo "expected_sha vacio: degradando a chequeo simple de HTTP 200."
          echo "Esperando health endpoint en ${{ inputs.base_url }}/api/health..."
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ inputs.base_url }}/api/health" || echo "000")
            if [ "$code" = "200" ]; then
              echo "Health OK tras ${i} intento(s) (~$((i*2))s)."
              exit 0
            fi
            echo "Intento ${i}: HTTP ${code}. Reintentando en 2s..."
            sleep 2
          done
          echo "Timeout: health endpoint no respondio 200 en 120s"
          exit 1

      - name: Smoke tests
        env:
          Api__BaseUrl: ${{ inputs.base_url }}
          ServiceBus__ConnectionString: ${{ secrets.SERVICEBUS_CONNECTION_STRING }}
          Postgres__ConnectionString: ${{ secrets.POSTGRES_CONNECTION_STRING }}
        run: dotnet test --project ${{ inputs.test_project }} --configuration Release
