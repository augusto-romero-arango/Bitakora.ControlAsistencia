name: Smoke Tests (dominio)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL base de la Function App'
        required: false
        default: 'https://func-asist-dev-programacion.azurewebsites.net'
      test_project:
        description: 'Ruta al proyecto de smoke tests'
        required: false
        default: 'tests/Bitakora.ControlAsistencia.Programacion.SmokeTests/'
      expected_sha:
        description: 'SHA de commit esperado en /api/version (vacio = solo esperar HTTP 200)'
        required: false
        default: ''
  workflow_call:
    inputs:
      base_url:
        type: string
        required: false
        default: 'https://func-asist-dev-programacion.azurewebsites.net'
      test_project:
        type: string
        required: false
        default: 'tests/Bitakora.ControlAsistencia.Programacion.SmokeTests/'
      expected_sha:
        type: string
        required: false
        default: ''
    secrets:
      SERVICEBUS_CONNECTION_STRING:
        required: false
      POSTGRES_CONNECTION_STRING:
        required: false

# Serializa las cuatro rutas que invocan este reusable (deploy-control-horas.yml,
# deploy-programacion.yml, deploy-projections.yml -- issue #314 -- y la matrix de
# smoke-tests.yml) contra el mismo Service Bus de dev y su unica suscripcion 'smoke-tests' --
# issue #313. Dos suites corriendo a la vez se roban mutuamente el mensaje que cada una espera
# (cada CompleteMessageAsync de una destruye el mensaje que la otra necesitaba).
#
# El grupo va AQUI, en el workflow LLAMADO, porque es el unico punto por el que pasan las cuatro
# rutas de disparo: un solo bloque las cubre. Que un workflow llamado reserve su propio grupo,
# independiente del run que lo invoca, esta evidenciado en github/community#30708: alli el sintoma
# es que el caller se cancela a si mismo cuando ambos piden el mismo grupo -- prueba de que la
# reserva del llamado ocurre de verdad y por invocacion.
#
# El nombre del grupo es un literal fijo a proposito, y no ${{ github.workflow }}: un workflow
# llamado hereda en ese contexto el nombre del CALLER (Deploy ControlHoras, Deploy Programacion,
# Deploy Projections o Smoke Tests (todos los dominios)). Interpolarlo aca daria un grupo distinto
# por invocador -- anulando la serializacion -- y ademas chocaria con el grupo del caller si este
# declarara uno.
# Es justamente la correccion que recomienda ese hilo.
#
# cancel-in-progress: false (CA-3) -- la corrida encolada espera; nunca cancela a la que esta
# verificando un deploy en curso.
#
# queue: max (CA-4) -- el default 'queue: single' admite UNA sola corrida pendiente por grupo, y la
# tercera en llegar cancela a la que estaba esperando, que queda reportada como 'cancelled' en el
# check. Con cuatro invocadores eso es alcanzable con UN solo push: los tres deploy-*.yml incluyen
# 'src/Bitakora.ControlAsistencia.PublicEvents/**', 'src/Bitakora.ControlAsistencia.PrivateEvents/**'
# y 'global.json' en su filtro de 'paths', asi que un push a main que toque cualquiera de esas rutas
# los dispara a los tres a la vez y los tres terminan pidiendo este grupo. Con 'queue: single' uno
# de ellos moriria como 'cancelled'. 'max' admite hasta 100 pendientes en orden FIFO segun cuando
# cada una entro al grupo. Solo es valido con cancel-in-progress en false; combinarlo con true es
# error de validacion del workflow.
# https://github.blog/changelog/2026-05-07-github-actions-concurrency-groups-now-allow-larger-queues/
#
# OJO si corres actionlint local: hasta 1.7.12 su schema no conoce 'queue' y lo reporta como
# 'unexpected key ... expected one of "cancel-in-progress", "group"'. Es atraso del linter frente al
# release de mayo 2026, no un error del workflow -- no borres la linea por ese hallazgo. Ningun
# workflow de este repo corre actionlint como gate.
concurrency:
  group: smoke-tests-dev
  cancel-in-progress: false
  queue: max

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    permissions:
      # Este workflow no declaraba 'permissions' y heredaba el default del repo. Al declararlo,
      # todo scope no listado queda en 'none', asi que 'contents: read' es obligatorio para que
      # actions/checkout siga clonando.
      contents: read
      # Lo necesitan 'Esperar el deploy del worker de proyecciones del mismo commit' y 'Esperar
      # deploys ajenos del mismo commit': listan runs y jobs de OTROS workflows del repo, y
      # ningun default concede ese scope.
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Carrera INVERSA a la de la guarda de abajo (issue #1157). Un push que toca
      # '*.DomainEvents/**', 'PrivateEvents/**', 'PublicEvents/**' o 'global.json' dispara a la
      # vez 'Deploy {Dominio}' y 'Deploy Projections' (los 'paths' de ambos los incluyen). El smoke
      # del dominio espera su propio SHA en /api/version y /api/ready, pero nada espera la
      # revision nueva del worker de proyecciones: los tests que leen vistas (GET/QUERY sobre
      # read models) corren contra la revision vieja del worker o en pleno cambio de revision.
      #
      # Evidencia (smoke de Deploy ControlHoras vs job 'deploy' de Deploy Projections, mismo commit):
      #
      #   run smoke             | arranca el smoke | termina el deploy del worker
      #   38281220818 (bc5048e7)| 17:02:24Z        | 17:02:42Z
      #   38416138972 (ebfe593b)| 14:48:33Z        | 14:48:39Z
      #
      # En ambos fallo el mismo test (ListarAdvertenciasProgramacionSemanal_DebeMostrarAdvertencias...:
      # 'advertencias' vacio, sin SuperaTopeDiario).
      #
      # Este paso va aparte de la guarda de #1154 y SIN 'if': esa guarda solo corre con
      # expected_sha == '' y esta espera aplica a todo invocador, porque todos los dominios tienen
      # vistas materializadas por el worker. El worker se identifica por la ruta exacta del run
      # (.path sin '@ref') y no por nombre. Se espera el JOB 'deploy' del worker y NUNCA el run
      # completo: su job de smoke pide el mismo grupo 'smoke-tests-dev' que este job ya tiene
      # tomado, asi que esperar el run entero seria un deadlock. Ese job ya incluye "Verificar la
      # revision activa" (imagen del SHA, revision activa). Se excluye github.run_id para que, en
      # deploy-projections.yml, el paso no se espere a si mismo.
      #
      # Si el job 'deploy' del worker termina en failure o cancelled, la suite continua con un
      # ::warning:: (corre contra la revision anterior; ese run ya queda en rojo). Si queda
      # skipped o no hay run del worker, continua sin aviso.
      - name: Esperar el deploy del worker de proyecciones del mismo commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          tmp=$(mktemp -d)
          ruta_worker=".github/workflows/deploy-projections.yml"
          # 5s x 120 = 10 min, como la guarda de abajo. Al agotarse se falla: continuar es la
          # carrera que este paso existe para cerrar.
          limite=120

          for intento in $(seq 1 "$limite"); do
            if ! gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=100" > "${tmp}/runs.json"; then
              echo "::error::No se pudieron listar los runs de ${SHA}."
              echo "Revisa que este job conserve 'actions: read' y que el endpoint acepte head_sha."
              exit 1
            fi

            workers=$(jq -r --arg propio "$RUN_ID" --arg ruta "$ruta_worker" '
              .workflow_runs[]
              | select((.id | tostring) != $propio)
              | select((.path | split("@")[0]) == $ruta)
              | "\(.id)|\(.status)|\(.name)"' "${tmp}/runs.json")

            if [ -z "$workers" ]; then
              echo "No hay run del worker de proyecciones para ${SHA}. Se continua."
              exit 0
            fi

            bloqueantes=""
            fallidos=""
            terminados=""
            while IFS='|' read -r id estado_run nombre; do
              if [ -z "$id" ]; then
                continue
              fi
              if ! gh api "repos/${REPO}/actions/runs/${id}/jobs" > "${tmp}/jobs.json"; then
                echo "::error::No se pudieron leer los jobs del run ${id} (${nombre})."
                exit 1
              fi
              # Estado agregado del job 'deploy' de ese run. 'ausente' cubre el run que sigue en
              # 'build-and-test': el job 'deploy' (needs: build-and-test) puede no figurar todavia
              # en /jobs, y tratarlo como terminado reabriria la carrera. Con el run ya
              # 'completed', 'ausente' equivale a skipped (build-and-test fallo o se cancelo).
              # No hay deadlock: el smoke del worker necesita su 'deploy', asi que mientras
              # 'deploy' no exista ese run no pide el grupo 'smoke-tests-dev'.
              estado_deploy=$(jq -r '
                [.jobs[] | select(.name == "deploy")]
                | if length == 0 then "ausente"
                  elif any(.[]; .status != "completed") then "en_vuelo"
                  elif any(.[]; .conclusion == "failure" or .conclusion == "cancelled") then "fallido"
                  elif any(.[]; .conclusion == "success") then "success"
                  else "skipped" end' "${tmp}/jobs.json")
              case "$estado_deploy" in
                en_vuelo)
                  bloqueantes="${bloqueantes}${nombre} (run ${id})"$'\n' ;;
                ausente)
                  if [ "$estado_run" != "completed" ]; then
                    bloqueantes="${bloqueantes}${nombre} (run ${id}, job 'deploy' aun no creado)"$'\n'
                  else
                    terminados="${terminados}${nombre} (run ${id}): sin job 'deploy' (skipped)"$'\n'
                  fi ;;
                fallido)
                  fallidos="${fallidos}${nombre} (run ${id})"$'\n' ;;
                *)
                  terminados="${terminados}${nombre} (run ${id}): job 'deploy' en ${estado_deploy}"$'\n' ;;
              esac
            done <<< "$workers"

            if [ -z "$bloqueantes" ]; then
              if [ -n "$terminados" ]; then
                echo "El job 'deploy' del worker de proyecciones de ${SHA} ya no esta en vuelo. Se continua."
                printf '%s' "$terminados" | sed 's/^/  - /'
              fi
              if [ -n "$fallidos" ]; then
                echo "::warning::El job 'deploy' del worker de proyecciones de ${SHA} termino en failure o cancelled; la suite corre contra la revision anterior del worker."
                printf '%s' "$fallidos" | sed 's/^/  - /'
              fi
              exit 0
            fi

            echo "Intento ${intento}/${limite}: esperando el job 'deploy' del worker de proyecciones de:"
            printf '%s' "$bloqueantes" | sed 's/^/  - /'
            sleep 5
          done

          echo "::error::Timeout: tras 10 min el job 'deploy' del worker de proyecciones de ${SHA} sigue en vuelo."
          printf '%s' "$bloqueantes" | sed 's/^/  - /'
          echo "Correr la suite ahora la ejercitaria contra un worker a medio desplegar."
          exit 1

      # Cierra la carrera diagnosticada el 2026-08-11 sobre los runs 31181921157 (sha 4eee1eb1),
      # 31151821734 (4c4d8b38) y 31134226036 (f11a5971) de Deploy Projections. En los tres,
      # 'build-and-test' y 'deploy' de ese workflow pasaron y lo unico que fallo fue este job; y en
      # los tres el job 'deploy' de Deploy ControlHoras -- que despliega la Function App bajo
      # prueba -- todavia estaba en vuelo cuando este arranco:
      #
      #   sha       | deploy del FA termina | este job arranca | resultado
      #   4eee1eb1  | 13:19:51              | 13:19:20 (-31s)  | failure
      #   4c4d8b38  | 05:51:23              | 05:51:02 (-21s)  | failure
      #   f11a5971  | 00:22:03              | 00:21:56 (-7s)   | failure
      #   1b6dbd69  | 16:36:36              | 16:36:18 (-18s)  | success  <- gano la carrera
      #
      # La MISMA suite, mismo commit y mismo entorno, paso 30-60s despues en el run de ControlHoras
      # en los tres fallos. El cuarto caso importa igual: el solapamiento ocurre en 4 de 4, asi que
      # la ventana es estructural y lo unico no determinista es quien la gana. Que en f11a5971 uno
      # de los tests caidos fuera ObtenerTurnoVigente_Retorna400_CuandoLaFechaTieneFormatoInvalido
      # -- validacion de formato, que no toca proyecciones ni read model -- descarta que el sintoma
      # viniera del worker de proyecciones.
      #
      # Por que la guarda vive AQUI y no en el invocador: es el mismo argumento que ya puso el
      # 'concurrency' de arriba en este archivo. Los invocadores se parten en dos clases, y la
      # frontera no es el dominio sino quien despliega el Function App que se prueba:
      #
      #   deploy-control-horas.yml : expected_sha = SHA propio  -> despliega el FA que prueba
      #   deploy-programacion.yml  : expected_sha = SHA propio  -> despliega el FA que prueba
      #   deploy-colaboradores.yml : expected_sha = SHA propio  -> despliega el FA que prueba
      #   deploy-projections.yml   : expected_sha = ''          -> prueba el FA de ControlHoras
      #   smoke-tests.yml (matrix) : no lo pasa -> ''           -> prueba los FA de los 3 dominios
      #
      # Solo puede gatear por version quien despliega el FA que prueba: tiene un SHA propio que
      # esperar en /api/version. Quien prueba un FA ajeno no lo tiene, degrada al HTTP 200 sobre
      # /api/health que el binario VIEJO contesta al instante, y queda expuesto. Por eso la
      # condicion de abajo es 'expected_sha == ""' y no una lista de dominios: identifica esa clase
      # sin nombrar a nadie, cubre a los dos invocadores expuestos de hoy y a los que vengan.
      # Un scaffold de dominio nuevo NO agranda la clase -- domain-scaffolder genera su
      # deploy-*.yml con expected_sha propio, verificado en deploy-colaboradores.yml.
      #
      # Se espera el JOB 'deploy' de los runs ajenos y NO el run completo, a proposito: el run
      # ajeno incluye su propio job de smoke, que pide el mismo grupo 'smoke-tests-dev' que este
      # job ya tiene tomado. Esperar el run entero seria un deadlock -- el ajeno no puede terminar
      # hasta que este libere el grupo, y este no continua hasta que el ajeno termine.
      #
      # PREMISA CORREGIDA (issue #1154): terminar el job 'deploy' ajeno NO implica que el FA ya
      # sirva el binario nuevo. Ese job termina cuando Azure/functions-action sube el zip
      # ("Successfully deployed web package"); el host reinicia despues, y mientras tanto
      # /api/health lo contesta 200 el binario VIEJO. Evidencia (log del job vs traza
      # 'Application started' de func-asist-dev-control-horas): la guarda liberaba entre 33 y 104 s
      # antes de que arrancara la instancia nueva (39731983655: 76 s, 39738130960: 33 s,
      # 39741202905: 104 s), y la suite corria contra la instancia vieja. Correlacion: 7 de 7
      # fallos de smoke de Deploy Projections desde 2026-10-10 tienen un Deploy ControlHoras del
      # mismo commit con 'deploy' en success; los commits sin ese deploy, 0 fallos.
      #
      # Por eso, al terminar la espera, si algun run ajeno de este commit desplego el FA bajo
      # prueba (job 'deploy' en success y su workflow declara 'app-name: <app>' del base_url), la
      # guarda emite expected_sha=<github.sha> y 'Warmup Function App' aplica el gate por SHA de
      # MEF-ADR-0031 (/api/version + /api/ready). Si el ajeno quedo skipped/failure/cancelled, o
      # desplego otro FA, se conserva el fallback a /api/health.
      - name: Esperar deploys ajenos del mismo commit
        id: guarda
        if: inputs.expected_sha == ''
        env:
          BASE_URL: ${{ inputs.base_url }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          # Un workflow llamado comparte el run del invocador, asi que este id ES el del run que
          # invoca a este reusable y aparece en la consulta de abajo. Excluirlo evita esperarse a
          # si mismo, que en deploy-projections.yml seria un deadlock inmediato: su propio job
          # 'deploy' ya esta 'completed' cuando este corre, pero en un invocador que llamara a
          # este reusable en paralelo con su deploy, no.
          RUN_ID: ${{ github.run_id }}
        run: |
          tmp=$(mktemp -d)
          # 5s x 120 = 10 min. Los deploys observados tardan 1-2 min, asi que el limite deja
          # margen de sobra; superarlo significa que algo esta mal de verdad y no que haya que
          # seguir esperando. Se falla en vez de continuar: continuar es exactamente la carrera
          # que este paso existe para cerrar, y un 'skip' silencioso reportaria verde una suite
          # que nunca corrio.
          limite=120

          for intento in $(seq 1 "$limite"); do
            if ! gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=100" > "${tmp}/runs.json"; then
              echo "::error::No se pudieron listar los runs de ${SHA}."
              echo "Revisa que este job conserve 'actions: read' y que el endpoint acepte head_sha."
              exit 1
            fi

            # Deploys ajenos de este commit que aun no terminaron. El prefijo 'Deploy ' es la
            # convencion de nombre de todos los deploy-*.yml del repo (Deploy ControlHoras,
            # Deploy Programacion, Deploy Colaboradores, Deploy Projections) y la que genera
            # domain-scaffolder; si algun dia deja de serlo, este filtro deja de ver al ajeno y
            # la carrera vuelve en silencio -- es el punto a revisar primero.
            ajenos=$(jq -r --arg propio "$RUN_ID" '
              .workflow_runs[]
              | select((.id | tostring) != $propio)
              | select(.name | startswith("Deploy "))
              | select(.status != "completed")
              | "\(.id)|\(.name)"' "${tmp}/runs.json")

            bloqueantes=""
            while IFS='|' read -r id nombre; do
              if [ -z "$id" ]; then
                continue
              fi
              # Se cuenta solo el job llamado 'deploy'. Si el run ajeno lo tiene 'skipped' -- el
              # caso de determinar-alcance cuando el PR no toco ese dominio -- cuenta como
              # completado y no bloquea.
              en_vuelo=$(gh api "repos/${REPO}/actions/runs/${id}/jobs" \
                --jq '[.jobs[] | select(.name == "deploy") | select(.status != "completed")] | length') || en_vuelo=""

              if ! [[ "$en_vuelo" =~ ^[0-9]+$ ]]; then
                echo "::error::No se pudieron leer los jobs del run ${id} (${nombre})."
                exit 1
              fi

              if [ "$en_vuelo" -gt 0 ]; then
                bloqueantes="${bloqueantes}${nombre} (run ${id})"$'\n'
              fi
            done <<< "$ajenos"

            if [ -z "$bloqueantes" ]; then
              echo "Ningun deploy ajeno de ${SHA} tiene su job 'deploy' en vuelo. Se continua."

              # Que FA se prueba: sin https://, sin path, sin .azurewebsites.net (como el warmup).
              app="${BASE_URL#https://}"
              app="${app%%/*}"
              app="${app%.azurewebsites.net}"

              # Runs ajenos Deploy * del mismo commit; se relee la lista tras la espera.
              candidatos=$(jq -r --arg propio "$RUN_ID" '
                .workflow_runs[]
                | select((.id | tostring) != $propio)
                | select(.name | startswith("Deploy "))
                | "\(.id)|\(.name)|\(.path)"' "${tmp}/runs.json")

              while IFS='|' read -r id nombre ruta; do
                if [ -z "$id" ]; then
                  continue
                fi
                ruta="${ruta%%@*}"
                exitoso=$(gh api "repos/${REPO}/actions/runs/${id}/jobs" \
                  --jq '[.jobs[] | select(.name == "deploy") | select(.conclusion == "success")] | length') || exitoso=""
                if ! [[ "$exitoso" =~ ^[0-9]+$ ]]; then
                  echo "::error::No se pudieron leer los jobs del run ${id} (${nombre})."
                  exit 1
                fi
                if [ "$exitoso" -gt 0 ] && [ -f "$ruta" ] && grep -Eq "^[[:space:]]*app-name:[[:space:]]*${app}[[:space:]]*$" "$ruta"; then
                  echo "El run ${id} (${nombre}) desplego ${app} en ${SHA}. Se esperara /api/version == ${SHA}."
                  echo "expected_sha=${SHA}" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              done <<< "$candidatos"

              echo "Ningun deploy ajeno exitoso de ${app} en ${SHA}. Se mantiene el fallback a /api/health."
              exit 0
            fi

            echo "Intento ${intento}/${limite}: esperando el job 'deploy' de:"
            printf '%s' "$bloqueantes" | sed 's/^/  - /'
            sleep 5
          done

          echo "::error::Timeout: tras 10 min sigue habiendo un deploy ajeno de ${SHA} en vuelo."
          printf '%s' "$bloqueantes" | sed 's/^/  - /'
          echo "Correr la suite ahora la ejercitaria contra un Function App a medio desplegar."
          exit 1

      - name: Warmup Function App
        run: |
          expected_sha="${{ inputs.expected_sha || steps.guarda.outputs.expected_sha }}"
          if [ -n "$expected_sha" ]; then
            # MEF-ADR-0031 seccion 3 (enmienda 2026-09-12, run 34722573915): 230s del
            # WEBSITES_CONTAINER_START_TIME_LIMIT + ~95s de teardown/reinicio + 92s del peor
            # swap sano = ~417s, redondeados a 420s. NO fallar rapido ante el primer arranque
            # fallido: App Service reintenta el mismo artefacto; mas de un reintento sale rojo.
            echo "Esperando que ${{ inputs.base_url }}/api/version reporte el SHA ${expected_sha}..."
            TIMEOUT_VERSION=420
            INTERVALO_VERSION=5
            inicio_version=$SECONDS
            intento=0
            ultimo_cuerpo=""
            version_ok=0
            while true; do
              restante=$((TIMEOUT_VERSION - (SECONDS - inicio_version)))
              if [ "$restante" -le 0 ]; then
                break
              fi
              max_time=$((restante < 15 ? restante : 15))
              intento=$((intento + 1))
              body=$(curl -s --max-time "$max_time" "${{ inputs.base_url }}/api/version" || echo "")
              ultimo_cuerpo="$body"
              if [[ "$body" == *"$expected_sha"* ]]; then
                echo "Version OK tras ${intento} intento(s) ($((SECONDS - inicio_version))s): ${body}"
                version_ok=1
                break
              fi
              restante=$((TIMEOUT_VERSION - (SECONDS - inicio_version)))
              if [ "$restante" -le 0 ]; then
                break
              fi
              espera=$((restante < INTERVALO_VERSION ? restante : INTERVALO_VERSION))
              echo "Intento ${intento}: version desplegada '${body}' no coincide con '${expected_sha}'. Reintentando en ${espera}s..."
              sleep "$espera"
            done
            if [ "$version_ok" -eq 0 ]; then
              app_name="${{ inputs.base_url }}"
              app_name="${app_name#https://}"
              app_name="${app_name%%/*}"
              app_name="${app_name%.azurewebsites.net}"
              startup_logs_url="https://${app_name}.scm.azurewebsites.net/api/vfs/LogFiles/StartupLogs/"
              echo "Timeout: /api/version no reporto el SHA esperado (${expected_sha}) en 420s. Ultimo cuerpo observado: '${ultimo_cuerpo}'. StartupLogs de Kudu: ${startup_logs_url}"
              exit 1
            fi

            # Issue #399 (incidente run 31904647437): el binario ya sirve el SHA esperado, pero el
            # write-path del event store puede seguir frio -- el gate de /api/version no lo
            # ejercita. /api/ready si abre una conexion contra el event store (Weasel
            # ensureStorageExistsAsync), asi que su primer 200 es la senal real de que el write-path
            # esta caliente. Sus 120s son un presupuesto propio de la capa de datos: NO comparte
            # el timeout del gate por SHA. Se mide por reloj (no por conteo de intentos) porque
            # --max-time hace variable cada intento; --max-time 15 acota cada peticion.
            echo "Esperando que ${{ inputs.base_url }}/api/ready responda 200..."
            timeout_ready=120
            inicio_ready=$(date +%s)
            intento=0
            while true; do
              intento=$((intento + 1))
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${{ inputs.base_url }}/api/ready" || echo "000")
              transcurrido=$(( $(date +%s) - inicio_ready ))
              if [ "$code" = "200" ]; then
                echo "Ready OK tras ${intento} intento(s) (~${transcurrido}s)."
                exit 0
              fi
              if [ "$transcurrido" -ge "$timeout_ready" ]; then
                echo "Timeout: /api/ready no respondio 200 en ${timeout_ready}s (ultimo HTTP ${code})."
                exit 1
              fi
              echo "Intento ${intento} (~${transcurrido}s transcurridos): /api/ready respondio HTTP ${code}. Reintentando en 3s..."
              sleep 3
            done
          fi

          echo "expected_sha vacio: degradando a chequeo simple de HTTP 200."
          echo "Esperando health endpoint en ${{ inputs.base_url }}/api/health..."
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ inputs.base_url }}/api/health" || echo "000")
            if [ "$code" = "200" ]; then
              echo "Health OK tras ${i} intento(s) (~$((i*2))s)."
              exit 0
            fi
            echo "Intento ${i}: HTTP ${code}. Reintentando en 2s..."
            sleep 2
          done
          echo "Timeout: health endpoint no respondio 200 en 120s"
          exit 1

      - name: Smoke tests
        env:
          Api__BaseUrl: ${{ inputs.base_url }}
          ServiceBus__ConnectionString: ${{ secrets.SERVICEBUS_CONNECTION_STRING }}
          Postgres__ConnectionString: ${{ secrets.POSTGRES_CONNECTION_STRING }}
        run: dotnet test --project ${{ inputs.test_project }} --configuration Release
