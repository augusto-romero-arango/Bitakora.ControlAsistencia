# Topologia de mensajeria — Bitakora.ControlAsistencia
#
# Documenta los topics de Azure Service Bus y sus subscriptions.
# Basado en ADR-0004 (topics por evento, no por dominio).
# Actualizado por el agente `eda-modeler` al modelar flujos nuevos.
# Validado por scripts/eda-lint.sh.
#
# CONVENCION DE NAMING (ADR-0004, ADR-0008):
# - Topics: kebab-case del evento en pasado (turno-creado, dia-depurado)
# - Subscriptions: {consumidor}-escucha-{productor} o {consumidor-contexto}
#
# ESTADO ACTUAL: seed inicial
# Topics del lote (CA-ADR-0043): 'programacion-turno-en-fechas-solicitada' y 'dias-depurados', ambos hacia la cola
# compartida 'actualizar-control-diario'.
# Los topics aqui documentados son el estado objetivo de la arquitectura.
#
# Ultima actualizacion: 2026-04-17 (alineacion con ADR-0004 tras issue #109)

service_bus:
  namespace: sb-asist-dev
  sku: Standard

  topics:
    - name: programacion-turno-en-fechas-solicitada
      owner: Programacion
      description: "Solicitud de programacion de un colaborador con todas sus fechas libres (un mensaje por solicitud)"
      events: [ProgramacionTurnoEnFechasSolicitada]
      subscriptions:
        - name: actualizar-control-diario
          consumer: ControlHoras
          note: "Cola compartida con sesion; GroupId = CodigoColaborador. Handler AsignarTurnosCuandoProgramacionTurnoEnFechasSolicitada"
    - name: dias-depurados
      owner: ControlHoras
      description: "Lote de dias depurados de un colaborador (ControlHoras -> ControlHoras)"
      events: [DiasDepurados]
      subscriptions:
        - name: actualizar-control-diario
          consumer: ControlHoras
          note: "Misma cola compartida"
