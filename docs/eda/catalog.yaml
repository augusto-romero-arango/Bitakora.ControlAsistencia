# Catalogo EDA -- Bitakora.ControlAsistencia
#
# Fuente de verdad para eventos, comandos, policies y value objects del sistema.
# Actualizado por el agente `eda-modeler` al modelar flujos y por `planner` al crear issues.
# Validado por scripts/eda-lint.sh.
#
# REGLAS:
# - Si un objeto ya existe aqui, reutilizalo con el mismo nombre y payload exacto
# - No crear variantes (si existe TurnoAsignado, no crear TurnoFueAsignado)
# - Eventos: PascalCase en pasado (MarcacionRegistrada, TurnoAsignado)
# - Comandos: PascalCase imperativo (RegistrarMarcacion, AsignarTurno)
# - Policies: PascalCase descriptivo (DepuracionAutomatica)
#
# CLASIFICACION DE VISIBILITY (ADR-0024 del marco):
# - public         -> IPublicEvent: lo consume OTRO BC (sistema externo). Cruza backbone / integracion externa.
# - private        -> IPrivateEvent: lo consume un dominio del MISMO BC. Cruza el ASB interno.
# - event-sourcing -> evento del aggregate, SIN marker de bus. No cruza ningun bus (event store de Marten).
#
# Ultima actualizacion: 2026-08-10 (dominio Colaboradores planificado: aggregate, 8 eventos,
#   8 comandos y 4 VOs del desglose #330/#348-#357. Todos event-sourcing puro, sin bus.
#   Anterior: 2026-07-18, un solo BC "Control de Asistencia". Ver context-map.yaml.)

events:
  - name: TurnoCreado
    context: Programacion
    description: Un nuevo turno fue creado en el catalogo con su estructura de franjas completa
    form: sealed class  # ADR-0015: evento con precondiciones, no record
    visibility: event-sourcing  # evento del aggregate, sin marker de bus, no cruza ASB
    payload:
      - field: TurnoId
        type: Guid
      - field: Nombre
        type: string
      - field: FranjasOrdinarias
        type: IReadOnlyList<FranjaOrdinaria>
        note: "Cada FranjaOrdinaria contiene sus Descansos y Extras ya asignados, con offsets inferidos"
    published_to: null  # se publicara cuando haya consumidores externos
    used_in: ["#3", "#4"]

  - name: ProgramacionTurnoSolicitada
    context: Programacion
    description: Se registro una solicitud de programacion de turno para un empleado en N dias
    visibility: event-sourcing  # evento del aggregate SolicitudProgramacion, sin marker de bus
    payload:
      - field: Id
        type: Guid
        note: "Identidad de la solicitud, generado por el cliente"
      - field: Empleado
        type: InformacionEmpleado
      - field: Fechas
        type: List<DateOnly>
      - field: DetalleTurno
        type: DetalleTurno
        note: "Turno completo resuelto del catalogo al momento de la solicitud"
    published_to: null
    used_in: ["#10"]

  - name: ProgramacionTurnoDiarioSolicitada
    context: Programacion
    description: Solicitud de programacion de turno para un empleado en un dia especifico
    visibility: private  # IPrivateEvent: ControlHoras es un dominio del MISMO BC (decision 2026-07-18). Cruza el ASB interno. Antes: public.
    payload:
      - field: SolicitudId
        type: Guid
        note: "CorrelationId que apunta a la solicitud original"
      - field: Empleado
        type: InformacionEmpleado
      - field: Fecha
        type: DateOnly
        note: "Un solo dia"
      - field: DetalleTurno
        type: DetalleTurno
    published_to: "topic 'programacion-turno-diario-solicitada' del ASB interno (via IPrivateEventSender)"
    consumed_by: [ControlHoras]  # dominio del mismo BC -> intra-BC, privado
    used_in: ["#10"]

  - name: TurnoDiarioAsignado
    context: ControlHoras
    description: Se asigno (o reasigno) un turno a un empleado para un dia especifico en ControlHoras
    visibility: event-sourcing  # evento del aggregate ControlDiario, sin marker de bus (hoy declara IPrivateEvent por error -- limpiar)
    payload:
      - field: InformacionEmpleado
        type: InformacionEmpleado
      - field: Fecha
        type: DateOnly
      - field: DetalleTurno
        type: DetalleTurno
      - field: SolicitudId
        type: Guid
        note: "Trazabilidad hacia la solicitud original en Programacion"
    published_to: null
    used_in: ["#12"]

  - name: MarcacionRegistrada
    context: ControlHoras
    description: Una marcacion fue recibida, normalizada y persistida en RegistroDeMarcacion
    visibility: event-sourcing  # evento de dominio del aggregate RegistroDeMarcacion. Hasta #270 tambien era IPrivateEvent (doble rol); #270 lo libera del bus y CA-ADR-0029 documenta la regla: un tipo por rol.
    payload:
      - field: EmpleadoId
        type: string
      - field: TimestampNormalizado
        type: DateTime
        note: "Truncado al minuto (floor). Ej: 08:09:59 -> 08:09:00"
      - field: TipoMarcacion
        type: string?
        note: "Opcional. Entrada o salida, si el dispositivo lo sabe"
      - field: DispositivoId
        type: string?
        note: "Opcional. ID del dispositivo que capturo la marcacion"
    published_to: null  # se persiste en el stream de RegistroDeMarcacion; el anuncio al BC lo lleva RegistroDeMarcacionCreado
    consumed_by: []
    used_in: ["#105", "#270"]

  - name: RegistroDeMarcacionCreado
    context: ControlHoras
    description: >
      Contrato de bus que anuncia al BC que nacio un Registro de Marcacion. Gemelo plano de
      MarcacionRegistrada: misma informacion, objetivo de negocio distinto -- el evento de dominio
      se persiste y es protegido, este solo comunica y es portable (CA-ADR-0025, CA-ADR-0029).
    visibility: private  # IPrivateEvent en PrivateEvents.ControlHoras. Cruza fisicamente el ASB interno del BC (MEF-ADR-0024 decision #3).
    payload:
      - field: EmpleadoId
        type: string
      - field: TimestampNormalizado
        type: DateTime
        note: "Truncado al minuto (floor), tal como lo normalizo el Registro de Marcacion"
      - field: TipoMarcacion
        type: string?
        note: "Opcional. Entrada o salida, si el dispositivo lo sabe"
      - field: DispositivoId
        type: string?
        note: "Opcional. ID del dispositivo que capturo la marcacion"
    published_to: "topic registro-de-marcacion-creado (ASB interno, via IPrivateEventSender). Provisionado en #274"
    consumed_by: ["AdicionarMarcacionCuandoRegistroDeMarcacionCreado (mismo BC)"]
    used_in: ["#270"]

  - name: MarcacionAdicionada
    context: ControlHoras
    description: Una marcacion normalizada fue adicionada al dia de trabajo de un empleado
    visibility: event-sourcing  # evento del aggregate ControlDiario, sin marker de bus (hoy declara IPrivateEvent por error -- limpiar)
    payload:
      - field: Id
        type: string
        note: "Stream ID del ControlDiario"
      - field: EmpleadoId
        type: string
      - field: TimestampNormalizado
        type: DateTime
      - field: TipoMarcacion
        type: string?
      - field: DispositivoId
        type: string?
        note: "Opcional. Propagado desde MarcacionRegistrada"
    published_to: null
    used_in: ["#106"]

  - name: DiaCalculado
    context: ControlHoras
    description: Resultado del recalculo del dia de trabajo — sale a Service Bus para nomina
    visibility: public  # IPublicEvent: lo consume el Sistema de nomina (externo, otro BC). Ver open question ADR-0024 en context-map.
    payload:
      - field: InformacionEmpleado
        type: InformacionEmpleado
        note: "Objeto completo del empleado"
      - field: Fecha
        type: DateOnly
      - field: ControlesDeFranja
        type: List<DetalleControlFranja>
        note: "DTO de cada ControlFranja: programacion + entrada/salida + anomalia. Reemplaza MarcacionesDepuradas + ProgramacionUsada separados"
      - field: DesgloseHoras
        type: DesgloseHoras
        note: "Desglose completo por concepto legislativo colombiano. 9 conceptos (8 + descanso). Minutos como int."
    published_to: "topic de Service Bus"
    consumed_by: ["Sistema de nomina (externo)"]
    used_in: ["#108"]

  # --- Dominio Colaboradores (desglose #330, sesion 2026-08-07/10; scaffold pendiente) ---
  - name: ColaboradorRegistrado
    context: Colaboradores
    description: Nace la persona en el dominio (bajo control de asistencia)
    visibility: event-sourcing
    payload:
      - field: Identificacion
        type: Identificacion
        note: "VO {Tipo}:{Numero}; es la clave del stream"
      - field: Nombre
        type: NombreColaborador
        note: "4 campos: PrimerNombre, SegundoNombre?, PrimerApellido, SegundoApellido?"
    published_to: null
    used_in: ["#330"]

  - name: VinculacionIniciada
    context: Colaboradores
    description: Se abre una vinculacion (registro inicial O reingreso — el evento no conoce su comando, CA-ADR-0029)
    visibility: event-sourcing
    payload:
      - field: Codigo
        type: string
        note: "Id transaccional asignado por el sistema externo (aplanado: CodigoColaborador)"
      - field: FechaInicio
        type: DateOnly
        note: "REQUERIDA — tiempo del hecho, viene del cliente"
    published_to: null
    used_in: ["#330", "#350"]

  - name: VinculacionTerminada
    context: Colaboradores
    description: El colaborador sale del control de asistencia. Sin motivo — el "por que" es dato autoritativo de RRHH/nomina, no de este BC (refinamiento #349, 2026-08-11)
    visibility: event-sourcing
    payload:
      - field: FechaEfectiva
        type: DateOnly
        note: "REQUERIDA — pasada (registro tardio) o futura (preaviso). >= FechaInicio de la vinculacion abierta"
    published_to: null
    used_in: ["#349"]

  - name: NombresCorregidos
    context: Colaboradores
    description: Enmienda de los nombres de la persona (typo o reutilizacion del stream por el dueno legitimo)
    visibility: event-sourcing
    payload:
      - field: Nombre
        type: NombreColaborador
    published_to: null
    used_in: ["#351"]

  - name: FechaInicioVinculacionCorregida
    context: Colaboradores
    description: Enmienda de la fecha de inicio de la ULTIMA vinculacion, con o sin terminacion registrada (refinamiento #352). No-solape con la anterior; coherencia con la terminacion propia
    visibility: event-sourcing
    payload:
      - field: FechaInicio
        type: DateOnly
    published_to: null
    used_in: ["#352"]

  - name: TerminacionAnulada
    context: Colaboradores
    description: Se deshace la terminacion de la ultima vinculacion — reabre con su codigo y fecha de inicio intactos (refinamiento #354, reemplaza a FechaTerminacionVinculacionCorregida - "corregir la fecha" es anular + terminar)
    visibility: event-sourcing
    payload: []
    published_to: null
    used_in: ["#354"]

  - name: EtiquetaAsignada
    context: Colaboradores
    description: Crea o sobrescribe el valor de una categoria en la vinculacion abierta
    visibility: event-sourcing
    payload:
      - field: Etiqueta
        type: Etiqueta
        note: "Doble forma: original (display) + normalizada (identidad)"
    published_to: null
    used_in: ["#355", "#356", "#357"]

  - name: EtiquetaRetirada
    context: Colaboradores
    description: Elimina una categoria de la vinculacion vigente
    visibility: event-sourcing
    payload:
      - field: CategoriaNormalizada
        type: string
    published_to: null
    used_in: ["#355"]

commands:
  - name: CrearTurno
    context: Programacion
    description: Define un nuevo turno con sus franjas en el catalogo
    trigger: HTTP POST
    payload:
      - field: TurnoId
        type: Guid
        note: "Generado por el cliente (front)"
      - field: Nombre
        type: string
      - field: Ordinarias
        type: "List<CrearTurno.Franja>"
        note: "Estructura anidada -- cada ordinaria agrupa sus descansos y extras"
    nested_types:
      - name: CrearTurno.Franja
        type: record DTO
        fields:
          - { field: Inicio, type: TimeOnly }
          - { field: Fin, type: TimeOnly }
          - { field: Descansos, type: "List<(TimeOnly, TimeOnly)>" }
          - { field: Extras, type: "List<(TimeOnly, TimeOnly)>" }
    produces: [TurnoCreado]
    used_in: ["#3", "#4"]

  - name: SolicitarProgramacionTurno
    context: Programacion
    description: Solicita la programacion de un turno del catalogo para un empleado en N dias
    trigger: HTTP POST
    payload:
      - field: Id
        type: Guid
        note: "Generado por el cliente"
      - field: TurnoId
        type: Guid
        note: "Referencia al turno en el catalogo"
      - field: Empleado
        type: "SolicitarProgramacionTurno.DatosEmpleado"
        note: "Tipo anidado con EmpleadoId, TipoIdentificacion, NumeroIdentificacion, Nombres, Apellidos"
      - field: Fechas
        type: "List<DateOnly>"
    produces: [ProgramacionTurnoSolicitada, ProgramacionTurnoDiarioSolicitada]
    used_in: ["#10"]

  - name: RegistrarMarcacion
    context: ControlHoras
    description: Recibe una marcacion cruda del sistema externo, la normaliza y la persiste
    trigger: HTTP POST
    payload:
      - field: EmpleadoId
        type: string
      - field: Timestamp
        type: DateTime
        note: "Timestamp crudo del dispositivo"
      - field: TipoMarcacion
        type: string?
        note: "Opcional. Entrada o salida"
      - field: DispositivoId
        type: string?
        note: "Opcional. ID del dispositivo"
    produces: [MarcacionRegistrada, RegistroDeMarcacionCreado]
    used_in: ["#105", "#270"]

  # --- Dominio Colaboradores (#330, #348-#357) ---
  - name: RegistrarColaborador
    context: Colaboradores
    description: Crea la persona bajo control de asistencia. Interfaz minima convergente (POST); falla SIEMPRE si el stream existe — la intencion de reingreso es de ReingresarColaborador; los adaptadores traducen.
    trigger: HTTP POST
    produces: [ColaboradorRegistrado, VinculacionIniciada]
    used_in: ["#330"]

  - name: ReingresarColaborador
    context: Colaboradores
    description: Abre una vinculacion nueva contra el stream existente (SIN nombres — corregir nombres es otra intencion). FechaInicio estrictamente posterior a la FechaEfectiva de la ultima terminacion (no-solape, refinamiento #350). Rechazos sincronos 409 (CA-ADR-0030)
    trigger: HTTP POST
    produces: [VinculacionIniciada]
    used_in: ["#350"]

  - name: TerminarVinculacion
    context: Colaboradores
    description: Cierra la vinculacion abierta con fecha efectiva (pasada o futura/preaviso). Sin motivo (refinamiento #349). Rechazos sincronos 409 — sin evento de fallo (CA-ADR-0030 propuesto)
    trigger: HTTP
    produces: [VinculacionTerminada]
    used_in: ["#349"]

  - name: CorregirNombres
    context: Colaboradores
    description: Enmienda los nombres de la persona. Solo exige existencia, no vigencia (refinamiento #351); idempotente por igualdad de valor
    trigger: HTTP
    produces: [NombresCorregidos]
    used_in: ["#351"]

  - name: CorregirFechaInicioVinculacion
    context: Colaboradores
    description: Enmienda la fecha de inicio de la ultima vinculacion (con o sin terminacion registrada, refinamiento #352). Rechazos sincronos 409 (CA-ADR-0030); idempotente por igualdad
    trigger: HTTP
    produces: [FechaInicioVinculacionCorregida]
    used_in: ["#352"]

  - name: AnularTerminacion
    context: Colaboradores
    description: Deshace la terminacion de la ULTIMA vinculacion (arrepentimiento del preaviso o fecha errada — corregir = anular + terminar). Tras un reingreso la terminacion anterior queda congelada. Rechazos sincronos 409 (CA-ADR-0030)
    trigger: HTTP POST
    produces: [TerminacionAnulada]
    used_in: ["#354"]

  - name: AsignarEtiqueta
    context: Colaboradores
    description: Crea o sobrescribe una etiqueta (un valor por categoria) en la vinculacion ABIERTA — 409 si tiene terminacion registrada, incluido preaviso (refinamiento #355). Idempotente si la etiqueta es identica por valor
    trigger: HTTP POST
    produces: [EtiquetaAsignada]
    used_in: ["#355"]

  - name: RetirarEtiqueta
    context: Colaboradores
    description: Elimina una categoria de la vinculacion ABIERTA — 409 si tiene terminacion registrada o si la categoria no existe (el typo debe aflorar, refinamiento #355)
    trigger: HTTP POST
    produces: [EtiquetaRetirada]
    used_in: ["#355"]

policies: []

aggregates:
  - name: CatalogoTurnos
    context: Programacion
    description: "Catalogo de turnos disponibles. Ver docs/eda/aggregates/catalogo-turnos.yaml"
    used_in: ["#3", "#4", "#10"]

  - name: SolicitudProgramacionAggregateRoot
    context: Programacion
    description: "Registra la intencion de programar un turno para un empleado en N dias. Identidad por invocacion (Guid)."
    used_in: ["#10"]

  - name: ControlDiarioAggregateRoot
    context: ControlHoras
    description: "Dia de trabajo de un empleado. Identidad: EmpleadoId + Fecha. Recibe programaciones y marcaciones, depura contra franjas, calcula desglose de horas, emite DiaCalculado."
    identity: "EmpleadoId (string) + Fecha (DateOnly), compuesto como string para Marten"
    used_in: ["#12", "#106", "#107", "#108", "#115", "#116"]

  - name: RegistroDeMarcacionAggregateRoot
    context: ControlHoras
    description: "Registro individual de una marcacion. Identidad determinista: {EmpleadoId}:{TimestampCrudo}. Normaliza, persiste MarcacionRegistrada y empaqueta el contrato de bus RegistroDeMarcacionCreado (Tell-don't-Ask, espejo de ControlDiario.CrearDiaCalculado)."
    identity: "{EmpleadoId}:{Timestamp:yyyy-MM-ddTHH:mm:ss} — stream ID determinista para idempotencia por duplicado exacto"
    used_in: ["#105", "#270", "#275"]

  - name: ColaboradorAggregateRoot
    context: Colaboradores
    description: "Persona bajo control de asistencia. Contiene sus vinculaciones (max una vigente, sin solapes) con Codigo transaccional, y las etiquetas de la vinculacion vigente. Status: planificado (#330, scaffold pendiente)."
    identity: "Identificacion.ToString() — {TipoIdentificacion}:{NumeroIdentificacion}, por tenant"
    used_in: ["#330", "#348", "#349", "#350", "#351", "#352", "#354", "#355"]

value_objects:
  - name: FranjaOrdinaria
    source: src/Bitakora.ControlAsistencia.Contracts/ValueObjects/FranjaOrdinaria.cs
    description: "Segmento continuo de trabajo. Contiene descansos y extras. HoraInicio, HoraFin, DiaOffsetFin, Descansos, Extras."
    used_in: ["#2"]

  - name: SubFranja
    source: src/Bitakora.ControlAsistencia.Contracts/ValueObjects/SubFranja.cs
    description: "Segmento temporal dentro de una ordinaria. Puede ser descanso o extra segun la lista que lo contenga. HoraInicio, HoraFin, DiaOffsetInicio, DiaOffsetFin."
    used_in: ["#2"]

  - name: FranjaTemporal
    source: src/Bitakora.ControlAsistencia.Contracts/ValueObjects/FranjaTemporal.cs
    description: "Clase abstracta base para franjas. Encapsula estado temporal, calculo de duracion, formato ToString."
    used_in: ["#2"]

  - name: DetalleTurno
    source: src/Bitakora.ControlAsistencia.Contracts/ValueObjects/DetalleTurno.cs
    description: "Representacion plana del turno que viaja en eventos entre dominios. Nombre, FranjasOrdinarias. Record inmutable sin comportamiento de dominio."
    used_in: ["#10", "#12"]

  - name: DetalleFranjaOrdinaria
    source: src/Bitakora.ControlAsistencia.Contracts/ValueObjects/DetalleFranjaOrdinaria.cs
    description: "Representacion plana de una franja ordinaria para eventos. HoraInicio, HoraFin, DiaOffsetFin, Descansos, Extras."
    used_in: ["#10"]

  - name: DetalleSubFranja
    source: src/Bitakora.ControlAsistencia.Contracts/ValueObjects/DetalleSubFranja.cs
    description: "Representacion plana de una sub-franja para eventos. HoraInicio, HoraFin, DiaOffsetInicio, DiaOffsetFin."
    used_in: ["#10"]

  - name: InformacionEmpleado
    source: src/Bitakora.ControlAsistencia.Contracts/ValueObjects/InformacionEmpleado.cs
    description: "Informacion basica del empleado que viaja en eventos. EmpleadoId (string opaco decidido por el cliente), TipoIdentificacion, NumeroIdentificacion, Nombres, Apellidos. Record inmutable."
    used_in: ["#10", "#12"]

  - name: ControlFranja
    source: null  # por crear en #107
    description: >
      Objeto rico en ControlHoras que combina la franja programada (DetalleFranjaOrdinaria)
      con la realidad operativa (Entrada, Salida). EsAnomala es calculada.
      Espeja el patron de naming de ControlDiario. Absorbera calculo de desglose por franja.
    used_in: ["#107", "#108", "#115"]
    note: "Reemplaza a MarcacionDepurada. Vive en ControlHoras, no en Contracts. DiaCalculado usa un DTO (DetalleControlFranja) para cruzar fronteras."

  - name: DetalleControlFranja
    source: null  # por crear en #108
    description: >
      DTO plano que representa un ControlFranja en el evento publico DiaCalculado.
      Contiene la programacion de la franja + entrada/salida + anomalia.
      Vive en Contracts para que consumidores externos lo deserialicen.
    used_in: ["#108"]

  # --- Value objects del desglose de horas (sesion 2026-04-17) ---

  - name: MomentoDelDia
    source: null  # por crear en #112
    context: ControlHoras
    description: >
      Value object atomico que combina TimeOnly + int DiaOffset en una unidad comparable y ordenable.
      Representa un instante relativo dentro de un dia de trabajo (que puede cruzar medianoche).
      MinutosAbsolutos = Hora.Hour * 60 + Hora.Minute + DiaOffset * 1440.
      Implementa IComparable<MomentoDelDia>. Operador - produce int (minutos).
    used_in: ["#112"]
    note: >
      Consolida el patron repetido en FranjaTemporal (4 campos separados: HoraInicio, HoraFin,
      DiaOffsetInicio, DiaOffsetFin) en un unico tipo atomico. Es la representacion canonica
      en contratos publicos — no se usa DateTime absoluto.

  - name: IntervaloTemporal
    source: null  # por crear en #112
    context: ControlHoras
    description: >
      Rango temporal definido por dos MomentoDelDia (Inicio, Fin). DuracionEnMinutos calculada como
      Fin - Inicio en minutos (int). Soporta Contiene(MomentoDelDia),
      Intersectar(IntervaloTemporal) y EstaContenidoEn(IntervaloTemporal).
      Invariante: Inicio < Fin.
    used_in: ["#112"]
    note: "Base para segmentar franjas contra bandas horarias (diurna/nocturna). Usado por el clasificador de horas."

  - name: Concepto
    source: null  # por crear en #114
    context: ControlHoras
    description: >
      Enum cerrado con los 9 conceptos legislativos colombianos de clasificacion de tiempo:
      OrdinariaDiurna, OrdinariaNocturna, ExtraDiurna, ExtraNocturna,
      DominicalFestivaDiurna, DominicalFestivaNocturna,
      ExtraDiurnaDominicalFestiva, ExtraNocturnaDominicalFestiva, Descanso.
    used_in: ["#114"]
    note: >
      Basado en CST (Ley 2466/2025): banda diurna 6AM-7PM, nocturna 7PM-6AM.
      Domingo/festivo = dia calendario completo (00:00-24:00).
      Recargo dominical gradual: 80% (jul 2025), 90% (jul 2026), 100% (jul 2027).

  - name: IntervaloClasificado
    source: null  # por crear en #114
    context: ControlHoras
    description: >
      Tupla (IntervaloTemporal, Concepto) que representa un segmento de tiempo ya clasificado.
      Producido al segmentar un intervalo de trabajo contra las bandas horarias y el tipo de dia.
      La suma de duraciones de todos los IntervaloClasificado de una franja == duracion total trabajada en esa franja.
    used_in: ["#114", "#115"]

  - name: DesgloseFranja
    source: null  # por crear en #114 (estructura), #115 (logica de calculo que la produce)
    context: ControlHoras
    description: >
      Resultado del calculo de desglose para una franja individual. Contiene los intervalos
      clasificados, el retardo (si aplica) y los minutos por concepto (int). Producido por
      ControlFranja al clasificar el tiempo trabajado contra bandas horarias y tipo de dia.
    used_in: ["#114", "#115"]

  - name: DetalleRetardo
    source: null  # por crear en #114 (estructura), #115 y #116 (uso)
    context: ControlHoras
    description: >
      Informacion del retardo en una franja: minutos de retardo (int) y minutos compensados (int)
      (por exceso en otra franja). El retardo neto = MinutosRetardados - MinutosCompensados.
