# Mapa de contextos — Bitakora.ControlAsistencia
#
# Documenta el bounded context del sistema, sus dominios internos, los sistemas
# externos con los que integra, y las relaciones entre ellos.
# Basado en ADR-0001 (Function App por dominio), ADR-0004 (topics Service Bus),
# ADR-0024 del marco (modelo de eventos privado/publico por BC) y el lenguaje ubicuo.
#
# TIPOS DE RELACION (DDD Context Mapping):
# - Upstream-Downstream: el upstream publica, el downstream consume y se adapta
# - Customer-Supplier: el downstream (cliente) puede influir en el upstream (proveedor)
# - Conformist: el downstream acepta el modelo del upstream tal cual (sin anticorruption layer)
# - AntiCorruptionLayer: el downstream traduce el modelo del upstream a su propio lenguaje
# - SharedKernel: subdominio comun compartido (en nuestro caso: Contracts/)
#
# CLASIFICACION DE EVENTOS (ADR-0024 del marco):
# - Un evento es PUBLICO (IPublicEvent) si lo consume OTRO bounded context (aqui: un
#   sistema externo). Cruza el backbone compartido / integracion externa.
# - Un evento es PRIVADO (IPrivateEvent) si lo consume un dominio del MISMO BC (aunque
#   sea otra Function App). Cruza el ASB interno del BC.
# - Un evento de EVENT SOURCING (del aggregate, sin marker) no cruza ningun bus: vive
#   en el event store de Marten.
#
# Ultima actualizacion: 2026-08-10 (el dominio planificado "Empleados" se renombra a
#   "Colaboradores" — el lenguaje ubicuo cambio: Colaborador es independiente del tipo de
#   vinculacion (abre la puerta a contratistas). Identidad por Identificacion (streamId),
#   vinculaciones internas con Codigo transaccional. Desglose: #330, #348-#357. Ver field notes.)
#
# Contextos / ideas descartadas:
# - Depuracion, CalculoHoras (2026-04-04 — 2026-04-15): absorbidos por ControlHoras como
#   logica interna de ControlDiarioAggregateRoot (depurador y calculadora).
# - "Programacion y ControlHoras como bounded contexts separados" (2026-04-15 — 2026-07-18):
#   reconsiderado. Son dominios del mismo BC; el unico evento entre ellos es intra-BC (privado).
#   Lo unico verdaderamente inter-BC es lo que sale hacia sistemas externos (nomina).
# - "Empleados" como nombre del dominio maestro (2026-08-06 — 2026-08-10): renombrado a
#   Colaboradores. "Plantilla"/"maestro" como sustantivos del conjunto: descartados —
#   el dominio mismo anuncia el conjunto ("los colaboradores vigentes").

# -------------------------
# BOUNDED CONTEXT (uno solo, interno)
# -------------------------
bounded_context:
  name: Control de Asistencia
  namespace_root: Bitakora.ControlAsistencia
  description: >
    Control de asistencias y calculo de horas segun la legislacion laboral colombiana.
    Un unico BC compuesto por varios dominios (Function Apps, ADR-0001) que comparten
    el mismo ASB interno y el Shared Kernel de Contracts. Los eventos entre dominios
    son privados (intra-BC); solo lo que sale hacia sistemas externos es publico.

  shared_kernel:
    name: Contracts
    location: src/Bitakora.ControlAsistencia.Contracts/
    description: Value objects y tipos de eventos compartidos entre los dominios del BC
    contains:
      - DetalleTurno
      - InformacionEmpleado
      - DesgloseHoras

  domains:
    - name: Programacion
      namespace: Bitakora.ControlAsistencia.Programacion
      status: en-desarrollo
      description: >
        Gestiona el catalogo de turnos (plan del dia, componible: CA-ADR-0033), las plantillas
        semanales de turnos (molde de 1..N semanas lunes-domingo con referencias al catalogo:
        CA-ADR-0034, #620-#629) y la solicitud de programacion de turnos a colaboradores por
        fechas concretas. Los ciclos NO semanales (4x2, 2x2) no estan modelados.
      aggregates: [CatalogoTurnos, SolicitudProgramacionAggregateRoot]
      actors_served: [Programador de turnos]
      publishes_intra_bc: [ProgramacionTurnoDiarioSolicitada]  # privado, lo consume ControlHoras
      note: "Publica ProgramacionTurnoDiarioSolicitada (IPrivateEvent) al ASB interno para que ControlHoras lo consuma."

    - name: ControlHoras
      namespace: Bitakora.ControlAsistencia.ControlHoras
      status: en-desarrollo
      description: >
        Recibe marcaciones del sistema externo y programaciones de Programacion.
        Depura marcaciones contra franjas del turno, calcula desglose de horas
        y emite DiaCalculado. Es reactivo: cada cambio de estado dispara recalculo.
      aggregates: [RegistroDeMarcacionAggregateRoot, ControlDiarioAggregateRoot]
      actors_served: [Aprobador]
      consumes_intra_bc: [ProgramacionTurnoDiarioSolicitada, MarcacionRegistrada]  # privados, del mismo BC
      publishes_public: [DiaCalculado]  # hacia el Sistema de nomina (externo)
      note: >
        Absorbe la logica de Depuracion y CalculoHoras como metodos internos
        de ControlDiarioAggregateRoot (depurador y calculadora).
        Publica DiaCalculado (IPublicEvent) hacia el Sistema de nomina externo.

    - name: Colaboradores
      namespace: Bitakora.ControlAsistencia.Colaboradores
      status: planificado  # desglose listo: #348-#357; scaffold pendiente (/scaffold)
      description: >
        Fuente autoritativa sobre quienes estan bajo control de asistencia. Existir en el
        dominio significa "a esta persona le controlamos la asistencia" — no es espejo del
        maestro de RRHH (los usuarios son autonomos; cargas iniciales sin sincronizacion).
        Colaborador es independiente del tipo de vinculacion (empleados y, a futuro,
        contratistas). Identidad por Identificacion ({Tipo}:{Numero} = streamId); las
        vinculaciones (max una vigente, sin solapes) viven dentro del aggregate con su
        Codigo transaccional; etiquetas dinamicas de la vinculacion para segmentar reportes.
        Vigencia evaluada al consultar contra la fecha del lector (sin booleano materializado).
      aggregates: [ColaboradorAggregateRoot]
      actors_served: [Programador de turnos, Aprobador]
      decided:
        - "Ingesta inicial por POST HTTP (interfaz minima convergente); webhook nomina, otros sistemas, UI y archivo llegan despues como triggers adicionales del mismo comando; los adaptadores traducen (registrar vs reingresar)."
        - "Tiempo bitemporal: el tiempo de los hechos (fechas de vinculacion, REQUERIDAS) viene del cliente; el sistema solo registra cuando se entero."
      open_questions:
        - "Sede natural del colaborador: DIFERIDA hasta que exista el dominio Sedes (y decidir si es de la persona o de la vinculacion)."
        - "Impacto de vinculaciones sobre marcaciones/dias calculados: #358 (analisis)."
        - "AnularTerminacion (arrepentimiento del preaviso): refinamiento de #354."

# -------------------------
# SISTEMAS EXTERNOS (otros BCs / aplicaciones ajenas — integracion)
# -------------------------
external_systems:
  - name: Sistema de marcacion
    role: upstream (productor)
    description: Sistema externo que captura marcaciones crudas de los empleados.
    feeds: ControlHoras
    mechanism: "Por definir (HTTP o Service Bus). ControlHoras normaliza y emite MarcacionRegistrada internamente."

  - name: Sistema de nomina
    role: downstream (consumidor)
    description: Aplicacion externa que consume el desglose de horas para liquidar nomina.
    consumes_from: ControlHoras
    mechanism: "Evento DiaCalculado (IPublicEvent) publicado en Service Bus."
    open_questions:
      - "ADR-0024: Nomina es 'backbone compartido del producto' o 'integracion verdaderamente externa' (diferida)? Hoy DiaCalculado solo tiene la subscription smoke-tests; no hay consumidor real todavia."

  - name: Sistema de empleados / RRHH
    role: upstream (productor, sin autoridad)
    description: >
      Posible fuente de cargas iniciales de colaboradores. SIN sincronizacion: la fuente
      de verdad es el dominio Colaboradores; los usuarios son autonomos (decision 2026-08-07).
    feeds: Colaboradores
    mechanism: "POST HTTP inicial; futuros adaptadores (webhook de nomina, archivo) traducen a los comandos RegistrarColaborador/ReingresarColaborador."

# -------------------------
# RELACIONES
# -------------------------
relationships:
  # --- Intra-BC (entre dominios del mismo BC — flujo de eventos privados, no context mapping) ---
  - from: Programacion
    to: ControlHoras
    scope: intra-BC
    description: "ControlHoras necesita el Turno de Programacion para depurar marcaciones y calcular horas. Ambos son dominios del mismo BC."
    mechanism: "ProgramacionTurnoDiarioSolicitada (IPrivateEvent) publicado al ASB interno. El Turno viaja COMPLETO en el evento — nunca como ID."
    adr: ADR-0002

  # --- Externas (integracion con otros BCs / sistemas ajenos) ---
  - from: Sistema de marcacion
    to: ControlHoras
    type: Upstream-Downstream
    scope: external
    description: "ControlHoras recibe Registros de Marcacion del sistema externo"
    mechanism: "Por definir (HTTP o Service Bus). RegistroDeMarcacionAggregateRoot normaliza y emite MarcacionRegistrada internamente."

  - from: ControlHoras
    to: Sistema de nomina
    type: Upstream-Downstream
    scope: external
    description: "ControlHoras publica DiaCalculado con el desglose de horas para que nomina lo consuma"
    mechanism: "Evento DiaCalculado (IPublicEvent) publicado en Service Bus"

  - from: Sistema de empleados / RRHH
    to: Colaboradores
    type: AntiCorruptionLayer
    scope: external
    description: >
      Fuentes automaticas (webhook de nomina, otros sistemas, archivos) alimentan al dominio
      Colaboradores SIN sincronizacion ni autoridad: los adaptadores traducen la semantica
      externa (upsert sucio) a las intenciones limpias del dominio (registrar vs reingresar),
      consultando la ficha o reaccionando al fallo informativo.
    mechanism: "POST HTTP (interfaz minima convergente, #330); adaptadores futuros por fuente."
