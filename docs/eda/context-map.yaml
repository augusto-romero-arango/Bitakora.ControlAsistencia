# Mapa de contextos — Bitakora.ControlAsistencia
#
# Documenta los bounded contexts del sistema y sus relaciones.
# Basado en ADR-0001 (Function App por dominio), ADR-0004 (topics Service Bus) y el lenguaje ubicuo.
#
# TIPOS DE RELACION (DDD Context Mapping):
# - Upstream-Downstream: el upstream publica, el downstream consume y se adapta
# - Customer-Supplier: el downstream (cliente) puede influir en el upstream (proveedor)
# - Conformist: el downstream acepta el modelo del upstream tal cual (sin anticorruption layer)
# - AntiCorruptionLayer: el downstream traduce el modelo del upstream a su propio lenguaje
# - SharedKernel: ambos contextos comparten un subdominio comun (en nuestro caso: Contracts/)
#
# Ultima actualizacion: 2026-04-15 (sesion de diseno flujo reactivo post-marcacion)
#
# Contextos descartados:
# - Depuracion (2026-04-04 — 2026-04-15): absorbido por ControlHoras. La depuracion es logica
#   interna de ControlDiarioAggregateRoot, no un bounded context separado.
# - CalculoHoras (2026-04-04 — 2026-04-15): absorbido por ControlHoras. El calculo de horas
#   es logica interna de ControlDiarioAggregateRoot (la calculadora).

# -------------------------
# SHARED KERNEL
# -------------------------
shared_kernel:
  name: Contracts
  location: src/Bitakora.ControlAsistencia.Contracts/
  description: Value objects y tipos de eventos compartidos entre todos los dominios
  contains:
    - DetalleTurno
    - InformacionEmpleado
    - DesgloseHoras

# -------------------------
# BOUNDED CONTEXTS
# -------------------------
contexts:
  - name: Programacion
    namespace: Bitakora.ControlAsistencia.Programacion
    status: en-desarrollo
    description: Gestiona turnos (definicion y asignacion a empleados). Ciclos y patrones semanales.
    aggregates: [CatalogoTurnos, SolicitudProgramacionAggregateRoot]
    actors_served: [Programador de turnos]
    upstream_of: [ControlHoras]
    external_producers: []
    note: "Publica ProgramacionTurnoDiarioSolicitada a Service Bus para que ControlHoras lo consuma."

  - name: ControlHoras
    namespace: Bitakora.ControlAsistencia.ControlHoras
    status: en-desarrollo
    description: >
      Recibe marcaciones del sistema externo y programaciones de Programacion.
      Depura marcaciones contra franjas del turno, calcula desglose de horas
      y emite DiaCalculado. Es reactivo: cada cambio de estado dispara recalculo.
    aggregates: [RegistroDeMarcacionAggregateRoot, ControlDiarioAggregateRoot]
    actors_served: [Aprobador]
    downstream_of: [Programacion]
    external_producers: [Sistema de marcacion]
    external_consumers: [Sistema de nomina]
    note: >
      Absorbe la logica de Depuracion y CalculoHoras como metodos internos
      de ControlDiarioAggregateRoot (depurador y calculadora).
      Publica DiaCalculado a Service Bus.

  - name: Empleados
    namespace: Bitakora.ControlAsistencia.Empleados
    status: planificado
    description: Gestiona el registro maestro de empleados.
    aggregates: []
    actors_served: [Programador de turnos, Aprobador]
    upstream_of: [Programacion, ControlHoras]
    external_producers: [Sistema de empleados / RRHH]
    open_questions:
      - "Que datos del empleado necesitamos? Solo los que importan para el control de asistencia."

# -------------------------
# RELACIONES ENTRE CONTEXTOS
# -------------------------
relationships:
  - from: Programacion
    to: ControlHoras
    type: Customer-Supplier
    description: "ControlHoras (cliente) necesita el Turno de Programacion (proveedor) para depurar marcaciones y calcular horas"
    mechanism: "ProgramacionTurnoDiarioSolicitada publicado en Service Bus. El Turno viaja COMPLETO en el evento — nunca como ID."
    adr: ADR-0002

  - from: Sistema de marcacion
    to: ControlHoras
    type: Upstream-Downstream
    description: "ControlHoras recibe Registros de Marcacion del sistema externo"
    mechanism: "Por definir (HTTP o Service Bus). RegistroDeMarcacionAggregateRoot normaliza y emite MarcacionRegistrada internamente."

  - from: ControlHoras
    to: Sistema de nomina
    type: Upstream-Downstream
    description: "ControlHoras publica DiaCalculado con el desglose de horas para que nomina lo consuma"
    mechanism: "Evento DiaCalculado publicado en Service Bus"

  - from: Empleados
    to: Programacion
    type: Upstream-Downstream
    description: "Programacion necesita saber que empleados existen para asignarles turnos"
    mechanism: "Por definir"

  - from: Empleados
    to: ControlHoras
    type: Upstream-Downstream
    description: "ControlHoras necesita identificar a quien corresponde cada marcacion"
    mechanism: "Por definir"
