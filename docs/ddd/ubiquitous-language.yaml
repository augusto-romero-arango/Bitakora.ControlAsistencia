# -------------------------
# VOCABULARIO DEL DOMINIO
# -------------------------
terms:
  - name: Sede del colaborador
    definition: >
      La unica sede a la que un colaborador esta asignado. Pertenece a la VINCULACION, no a la
      persona: el reingreso nace sin sede (espejo de las etiquetas #355) y asignar sobre una
      vinculacion terminada rechaza. Es el default que el cliente usa al programar (cascada de
      resolucion #331) -- NO es el ancla de costos: la sede efectiva del dia viaja estampada en
      los hechos operativos (DiaAprobado #489). El hecho es SedeAsignada(CodigoSede), referencia
      pura al maestro de sedes sin snapshot de nombre/CC; el servidor nunca consulta el maestro
      (ni existencia ni bandera Activa -- el filtro de sedes activas es del cliente/UI). Sin
      retiro: los unicos estados "sin sede" son el inicial y el post-reingreso. La vinculacion
      NACE con su sede: el ingreso (RegistrarColaborador) y el reingreso (IniciarVinculacion)
      aceptan CodigoSede OPCIONAL que viaja DENTRO de VinculacionIniciada (campo opcional nuevo,
      #520) -- nunca como SedeAsignada adicional en el commit. SedeAsignada queda RESERVADO para
      asignaciones/reasignaciones POSTERIORES a la creacion (#465, PUT). "Reingreso nace limpio"
      sigue siendo el default (campo ausente = null). Vista en #519 (lee la sede de ambos eventos).
    context: Colaboradores
    rejected_synonyms: [sede natural, sede principal]
    rejection_reason: >
      "sede natural" fue el nombre de trabajo en #331/#465 pero nunca cristalizo en codigo y no
      es lenguaje del negocio; "principal" implica sedes secundarias y el negocio confirmo que
      el colaborador tiene UNA sola sede (2026-08-30).
  - name: Marcacion
    definition: Acto de capturar el instante de entrada o salida de un empleado en un dispositivo. Concepto puro del sistema de marcacion, con toda su riqueza (huella, PIN, foto). Le pertenece al dispositivo, no a nuestro sistema.
    context: Externo
    rejected_synonyms: [fichaje, registro de entrada]
    rejection_reason: "fichaje es termino de Espana; registro de entrada es ambiguo"
    note: "Diferenciado de 'Registro de Marcacion', que es lo que nuestro sistema recibe y persiste."

  - name: Registro de Marcacion
    definition: >
      Dato destilado de una marcacion que nuestro sistema recibe de forma asincrona.
      Contiene solo los campos minimos (CodigoColaborador, Timestamp, opcionalmente TipoMarcacion y DispositivoId).
      Es lo que persistimos y procesamos. Aggregate independiente en ControlHoras con stream ID
      determinista en notacion "rdm:{CodigoColaborador}:{TimestampCrudo en ISO 8601 basico}"
      (renotacion decidida 2026-08-18, issue #419 refinado 2026-08-19; hasta su merge el codigo
      aun escribe "{CodigoColaborador}:{TimestampCrudo}" en formato extendido). Responsable de
      idempotencia por duplicado exacto y normalizacion (truncar segundos).
    context: ControlHoras
    note: >
      Interfaz minima convergente para cualquier sistema de marcacion (propio o externo).
      Principio de conservacion total: todo registro interpretable se guarda.
      La idempotencia por minuto normalizado la resuelve ControlDiario, no este aggregate.
      El identificador se llamaba EmpleadoId en el codigo; unificado en CodigoColaborador
      (sesion 2026-08-15, issue #401): es el mismo codigo aplanado que exporta el maestro Colaboradores.

  - name: TipoMarcacion
    definition: Indica si el registro corresponde a una entrada o una salida. Enum cerrado con valores "entrada" y "salida". Opcional — si el dispositivo no lo sabe, se omite y el depurador de ControlDiario lo infiere.
    context: ControlHoras
    rejected_synonyms: [direccion, sentido, movimiento]
    rejection_reason: "direccion es ambiguo (puede sonar a direccion postal); sentido y movimiento son menos naturales que tipo"

  - name: DispositivoId
    definition: >
      Identificador alfanumerico del dispositivo que capturo la marcacion. Opcional en el
      Registro de Marcacion. El dispositivo en si sigue siendo ajeno al sistema (id opaco,
      externo), pero la asociacion dispositivo -> sede ya no es configuracion del cliente:
      vive en el maestro de sedes (aggregate Sede, DispositivoInstalado/Retirado, #460).
    context: ControlHoras
    rejected_synonyms: [ubicacion, origen, fuente, sede, lugar, punto de marcacion]
    rejection_reason: "ubicacion/sede/lugar insinuan un concepto geografico; lo que recibimos es un ID de dispositivo. Origen/fuente suenan a metadata tecnica de integracion."
    date_updated: 2026-08-27

  - name: Normalizacion de marcacion
    definition: >
      Proceso de truncar los segundos del timestamp de una marcacion al registrarla.
      Ejemplo: 08:09:59 se normaliza a 08:09:00. La regla por defecto es truncar al minuto (floor).
      Configurable por empresa en el futuro para soportar otros redondeos.
    context: ControlHoras
    date_added: 2026-04-15

  - name: Ventana de traslape nocturno
    definition: >
      Rango de horas de madrugada (00:00 a HoraCorte) durante el cual una marcacion
      se envia tanto al dia calendario del timestamp como al dia anterior. Permite que
      turnos nocturnos que cruzan medianoche reciban sus marcaciones de salida.
      Default: 4AM. Configurable por empresa.
    context: ControlHoras
    date_added: 2026-04-15
    note: >
      Solo las marcaciones dentro de esta ventana generan doble envio.
      El depurador de cada ControlDiario decide si la marcacion le es relevante
      segun sus franjas. Si no le sirve, la ignora y no recalcula.

  - name: Turno
    definition: >
      Plan del dia reutilizable -- el atomo que compone la Plantilla semanal de turnos --: de
      trabajo (compuesta por franjas ordinarias,
      cada una con posibles descansos y extras contenidos) o de descanso (sin franjas,
      creada exclusivamente por el factory CrearDescanso). Se almacena en el catalogo con
      un Id (Guid generado por el cliente) y un nombre. Concepto operativo.
    context: Programacion
    date_updated: 2026-09-04
    note: >
      'Jornada' se reserva para el concepto juridico (duraciones y limites legales).
      Ampliacion 2026-08-17 (sesion planner, issue #423): el descanso programado es una
      entrada del catalogo con cero franjas -- biunivoco por construccion (la invariante
      '>=1 franja' sigue viva en Crear; CrearDescanso es la unica puerta al vacio).
      Sin enum ni jerarquia: el comportamiento emerge de la estructura (Tell-don't-Ask).
      Ampliacion 2026-08-24 (sesion planner, refinamiento de #423): el descanso entra por
      el MISMO comando CrearTurno (POST programacion/turnos, paso 1 de MEF-ADR-0043: mismo
      evento TurnoCreado -> mismo create); la deliberacion se declara con la marca EsDescanso,
      que vive SOLO en el DTO de frontera -- nunca en el evento ni en el aggregate.
      REVERSION PARCIAL 2026-09-04 (sesion planner, CA-ADR-0033, #599): el turno pasa a ser
      COMPONIBLE y EDITABLE SIEMPRE. Nace vacio (sin franjas) y se le agregan franjas por pasos
      (Diseno de turno); la biunivocidad "cero franjas = descanso" muere: un turno vacio puede ser
      un descanso o un Turno incompleto. La marca EsDescanso entra al evento TurnoCreado (bool
      plano; los streams legados sin la clave leen false) y al aggregate (_esDescanso). Un turno
      es PROGRAMABLE cuando esta completo: >= 1 franja ordinaria, o declarado descanso. Sin
      estados ni publicacion. Sigue sin comandos Mover*/Modificar*: corregir = quitar + agregar.
      Enmienda 2026-09-04 (CA-ADR-0034): la definicion deja de decir "plantilla" -- esa palabra
      nombra ahora el nivel 2 (Plantilla de turnos). El turno es el PLAN DEL DIA; el nombre del
      turno no es editable (no hay RenombrarTurno), su ToString() si cambia con el diseno.

  - name: Turno incompleto
    definition: >
      Turno del catalogo que existe pero todavia no es programable: no tiene franjas ordinarias
      y no fue declarado descanso. Es el estado natural de un turno recien creado por pasos
      (crear vacio -> agregar franjas) y el de un turno al que se le quito su ultima franja.
      Se edita libremente; SolicitarProgramacionTurno lo rechaza con 409 (TurnoIncompleto) hasta
      que tenga al menos una franja. En la ficha se ve como completo = false ("Sin franjas"); en
      las tools de consulta como enConstruccion.
    context: Programacion
    date_added: 2026-09-04
    rejected_synonyms: [turno vacio, turno borrador, turno en edicion]
    rejection_reason: >
      "Vacio" tambien describe al descanso (cero franjas) y confunde; "borrador"/"en edicion"
      sugieren un estado del ciclo de vida que el turno NO tiene (editable siempre, sin
      publicacion). "Incompleto" nombra exactamente lo que falta: franjas.
    note: "Nacido en #599 (modelo) y #613 (guarda de solicitud). CA-ADR-0033."

  - name: Diseno de turno
    definition: >
      Componer un turno del catalogo por pasos, cada uno un comando propio sobre el aggregate
      CatalogoTurnos: agregar franja ordinaria (opcionalmente con sede prearmada inline),
      agregar descanso o extra a una franja, quitar franja (arrastra sus hijas y sede), quitar
      descanso o extra, asignar o retirar la sede prearmada de una franja. Las franjas se
      identifican por su hora de inicio (unica por la invariante de no-solape); las hijas por
      franja + hora de inicio. Corregir = quitar + agregar. Aplica igual a un turno incompleto
      que a uno ya programable (las solicitudes hechas conservan su snapshot). Cada paso emite un
      evento de diseno que lleva la franja COMPLETA (la resultante; la removida en FranjaQuitada)
      para que Apply y la proyeccion reemplacen sin factories.
    context: Programacion
    date_added: 2026-09-04
    note: >
      Contratos HTTP: POST programacion/turnos/{id}:agregar-franja | :quitar-franja |
      :agregar-subfranja | :quitar-subfranja | :asignar-sede-franja (paso 4 MEF-ADR-0043; la
      hora HH:mm no es URL-safe, por eso no hay DELETE/PUT por sub-recurso). Issues #602-#606;
      tools MCP #608-#611; ficha #607. CA-ADR-0033.

  - name: Plantilla de turnos
    definition: >
      Termino PARAGUAS: molde reutilizable, con nombre y en catalogo, que compone varios dias a partir
      de turnos del catalogo -- el segundo nivel de composicion sobre el Turno (plan del dia). Tiene
      modalidades: la semanal (construida, ver Plantilla semanal de turnos) y, a futuro y solo si un
      cliente la necesita, la ciclica (rotaciones 4x2, 2x2, 6x1 con descanso que corre: dias por
      posicion, no por dia de la semana; seria OTRO aggregate). Ningun tipo de codigo se llama
      PlantillaTurnos a secas: el generico se reserva para la familia (anti-squatting).
    context: Programacion
    date_added: 2026-09-04
    rejected_synonyms: [Horario, Esquema de turnos, Semana tipo, Malla de turnos, Sabana de turnos, Patron de turnos]
    rejection_reason: >
      Horario roza con HorarioResumido (las horas de UN turno). Semana tipo muere con mas de una
      semana. Malla/Sabana nombran la grilla ya ASIGNADA (colaboradores x dias), no el molde. Patron
      significa empleador en derecho laboral colombiano. El experto eligio "plantilla" en su acepcion
      de molde reutilizable: NO contradice el rechazo de "Plantilla" como sinonimo de Colaborador
      (ahi la acepcion rechazada era "planta de personal").
    note: >
      REVIERTE PARCIALMENTE la decision del 2026-08-29 ("mallas/rotaciones NO son conceptos del
      dominio sino recetas del asistente"): lo que separa la receta del concepto es persistir +
      nombrar + reutilizar, y eso es lo que el experto pidio. La Ventana de trabajo sigue siendo
      efimera: la plantilla no tiene fechas, tiene dias de la semana. CA-ADR-0034.

  - name: Plantilla semanal de turnos
    definition: >
      Plantilla de turnos en modalidad semanal: 1..N semanas, siempre de lunes a domingo, donde cada
      dia (identificado por semana + dia de la semana) REFERENCIA un turno del catalogo por TurnoId.
      Nunca copia el turno: editar el turno se refleja en las asignaciones futuras; el snapshot ocurre
      al asignar (fuera de esta cadena). El descanso es un turno mas, no una omision: un dia sin turno
      la deja INCOMPLETA (existe, se ve, se edita, no es usable -- 409, espejo de Turno incompleto),
      igual que si un turno referenciado se retira del catalogo (el retiro no se bloquea ni cascadea).
      Completa = 7xN dias con turno vigente (derivada, sin evento). Nace vacia, se disena por pasos,
      editable siempre, sin estados (espejo de CA-ADR-0033); el dia es un slot atomico: corregir =
      reemplazar con PUT, no quitar + agregar. Semanas fijo al crear (cambiarlo = retirar + crear).
      Nombre unico best-effort (espejo de #497). Retiro espejo de #500/#501.
      Enmienda 2026-09-05 (refinamiento): Semanas entre 1 y 6 inclusive; el dia se codifica como numero
      ISO 8601 (ver Dia de la semana); SOLO turnos completos son asignables a un dia (409 TurnoIncompleto,
      verificado contra el aggregate CatalogoTurnos del mismo store, no contra la vista); el POST responde
      201 Created y los PUT/DELETE 204 No Content (CA-ADR-0035); PUT con el mismo turno, DELETE sobre un dia
      ya vacio y retirar una plantilla ya retirada son no-ops: exito sin evento, nunca 409.
    context: Programacion
    date_added: 2026-09-04
    date_updated: 2026-09-05
    rejected_synonyms: [PlantillaTurnos (sin modalidad), Ventana de trabajo, Periodo de programacion, turno inline sin nombre]
    rejection_reason: >
      El alias del evento persistido es el nombre simple de la clase y una futura PlantillaCiclica
      viviria en el mismo store: sin "Semanal" colisionarian y renombrar despues exige el protocolo
      de MEF-ADR-0036. No es una Ventana de trabajo (esa tiene fechas y es efimera). El turno
      descrito inline sin nombre se rechazo: duplicaria la superficie de diseno del turno o daria
      turnos "pobres"; la friccion de nombrar la resuelve el asistente creando el turno en el
      catalogo (tool crear_plantilla_semanal -- diferido a #651; #627 nace con turnos por nombre).
    note: >
      Aggregate PlantillaSemanalTurnos. Eventos: PlantillaSemanalCreada, DiaDePlantillaSemanalAsignado,
      DiaDePlantillaSemanalQuitado, PlantillaSemanalRetirada. Contratos: POST programacion/
      plantillas-semanales (paso 1); PUT .../{id}/dias/{semana}/{dia} (paso 2, slot atomico);
      DELETE .../dias/{semana}/{dia} y DELETE .../{id} (paso 3). Issues #620-#623 (aggregate y
      comandos), #626 (nombre unico), #627-#628 (tools de Comandos). CA-ADR-0034.

  - name: Cuadro semanal de turnos
    definition: >
      Vista read-side de una Plantilla semanal de turnos, para que el Programador (front o asistente)
      sepa si la plantilla que necesita ya existe, elija cual usar y vea de un vistazo que turno toca
      cada dia y si esta completa. Lo que el Programador lee, por dia: el turno con su nombre y su
      Descripcion (el ToString() del turno, lo que FichaTurno ya expone), y si esta retirado o incompleto;
      a nivel plantilla Nombre, Semanas y Completa (= 7xN dias con turno presente y completo). NO lleva las
      franjas: eso sigue siendo obtener_turno. Enmienda 2026-09-05: el DOCUMENTO materializado guarda solo
      Id, Nombre, Semanas y por dia (semana, dia ISO, TurnoId); nombre, descripcion, retirado, completo y
      Completa se resuelven al LEER, juntando con FichaTurno en el GET (CuadroSemanalTurnosRespuesta). "Cuadro de turnos" es
      el termino real en salud y vigilancia para la grilla dias x turnos; aqui es el cuadro de una
      plantilla, sin personas.
    context: Programacion
    date_added: 2026-09-04
    date_updated: 2026-09-05
    rejected_synonyms: [FichaPlantillaSemanal, Vista de plantilla, Resumen de plantilla]
    rejection_reason: >
      "Ficha" NO es doctrina de naming (experto, 2026-09-04): nacio para resolver colaboradores y
      se estaba volviendo un sufijo comodin equivalente a "View", que MEF-ADR-0041 proscribe.
      Tampoco se reemplaza por otro comodin (Resumen*, Detalle*). Cada vista se nombra desde el
      actor que la lee; las Ficha* existentes se quedan.
    note: >
      Codigo CuadroSemanalTurnos (simetrico con el aggregate PlantillaSemanalTurnos: el molde y su
      cuadro). Receta N1 (SingleStreamProjection sobre el stream de la plantilla), enmienda 2026-09-05:
      el N2 con grouper custom se rechazo porque obligaba a la proyeccion a consultar estado externo
      (regla de procedencia del Skill projections) y tenia carrera de lote; la composicion con FichaTurno
      ocurre en el GET (read-apis.md: DTO de respuesta para componer varias vistas). Functions
      ObtenerCuadroSemanalTurnos / ListarCuadrosSemanalesTurnos sobre GET programacion/
      plantillas-semanales[/{id}] (misma ruta del recurso leida desde el read-side, criterio de
      FichaTurno). Sin filtro server-side; lista tambien las incompletas. Issues #624 (vista), #625
      (GET + composicion), #629 (tools de Consultas). CA-ADR-0034 (decision 5 enmendada).

  - name: Dia de la semana
    definition: >
      Posicion de un dia dentro de la semana lunes-domingo de una Plantilla semanal de turnos, codificada
      como numero ISO 8601: 1 = lunes ... 7 = domingo. Es un CODIGO neutral (viaja igual en la ruta
      PUT/DELETE .../dias/{semana}/{dia} y en los eventos DiaDePlantillaSemanalAsignado/Quitado); la
      etiqueta en el idioma del usuario ("lunes", "Monday") es presentacion y se localiza por .resx o en
      el asistente, nunca se persiste.
    context: Programacion
    date_added: 2026-09-05
    rejected_synonyms: ["System.DayOfWeek persistido", "lunes..domingo como codigo persistido"]
    rejection_reason: >
      DayOfWeek numera domingo = 0: sombra de la plataforma .NET que obliga a rotar el orden en cada
      consumidor y contradice ISO. La palabra en espanol amarra el event store a un idioma (objecion del
      experto, 2026-09-05): es etiqueta, no codigo. La friccion ISO <-> .NET se paga una sola vez, en
      DiaSemana.Desde(DayOfWeek), cuando la asignacion futura la necesite.
    note: >
      VO DiaSemana (Programacion.DomainEvents), lista cerrada de 7 instancias canonicas (patron
      TipoIdentificacion): Numero, Desde(int); Desde(DayOfWeek) y ToString() .resx llegan con su primer
      consumidor. Persistido dentro del evento como su numero (ConfigurarSerializacion del evento, como
      Identificacion persiste _tipo). En las tools MCP el asistente escribe lunes..domingo o 1..7 y la tool
      traduce (DiaSemanaMcp). Issues #621 (nace), #622, #627-#629. CA-ADR-0034 decision 1 (enmendada).

  - name: Turno Diario
    definition: >
      El turno que rige efectivamente a un empleado en una fecha concreta. Es el resultado,
      por dia, de aplicar TurnoDiarioAsignado al ControlDiario del par (EmpleadoId, Fecha):
      un stream por dia de trabajo, no por solicitud. Si una fecha se reprograma, el ultimo
      TurnoDiarioAsignado sobrescribe al anterior -- "el ultimo gana" -- asi que el Turno
      Diario siempre refleja la asignacion vigente, nunca el historial de reprogramaciones.
    context: ControlHoras
    date_added: 2026-08-03
    note: "Diferenciado de 'Turno' (context: Programacion), la plantilla del catalogo. Turno es la plantilla reutilizable; Turno Diario es su aplicacion concreta a un empleado y una fecha. Ampliacion 2026-08-29 (#499): cancelable via Cancelacion de Programacion -- TurnoDiarioCancelado deja el dia sin plan; el stream conserva la memoria."

  - name: Franja Ordinaria
    definition: Segmento continuo de trabajo dentro de un turno. Es la franja principal que recibe marcaciones. Puede contener franjas de descanso y/o franjas de extra.
    context: Programacion
    date_updated: 2026-09-04
    note: >
      Solo las ordinarias pueden contener otras franjas. Una ordinaria NO puede contener otra
      ordinaria. Ampliacion 2026-09-04 (#598, decision del experto): dura mas de 0 y COMO MAXIMO
      24 h inclusive (la jornada maxima es 24 h; esquemas 24x24 de vigilancia) -- 08:00-08:00+1
      es valido y solo expresable con diaOffsetFin explicito. Su identidad dentro del turno es la
      hora de inicio (Diseno de turno). Inmutable: agregar/quitar hijas o cambiar sede produce una
      franja nueva (ConDescanso/ConExtra/SinDescanso/SinExtra/ConSede).
    rejected_synonyms: [tramo, bloque, segmento]

  - name: Franja de Descanso
    definition: >
      Pausa operativa dentro de una franja ordinaria (ej. almuerzo). Su tiempo se descuenta
      del trabajo al momento del calculo. Es hoja — no contiene otras franjas.
      No requiere marcaciones: se asume que se toma como programado. Si el cliente
      quiere control de marcaciones durante descansos, debe crear franjas ordinarias separadas.
    context: Programacion
    note: >
      No modela derechos laborales (lactancia) ni actividades (pausas activas, reuniones). Solo
      pausas operativas del horario. Ampliacion 2026-09-04 (#598/#600/#603/#605): duracion
      positiva obligatoria; sus offsets de dia NO son entrada -- se infieren relativos a la franja
      contenedora al construirla (y quedan persistidos); se agrega y se quita por pasos
      identificada por su hora de inicio dentro de la franja.
    date_updated: 2026-09-04

  - name: Franja de Extra
    definition: Horas extras programadas dentro de una franja ordinaria. Representan un compromiso del empleado. Es hoja — no contiene otras franjas.
    context: Programacion
    date_updated: 2026-09-04
    note: >
      Las extras NO programadas (el jefe pidio quedarse) se resuelven en ControlHoras, no en
      Programacion. Ampliacion 2026-09-04: misma forma e invariantes que la Franja de Descanso
      (duracion positiva, offsets inferidos, agregar/quitar por pasos por hora de inicio); solo
      difiere la lista que la contiene -- por eso una sola tool/comando con discriminador tipo.

  - name: Offset de dia
    definition: "Indicador relativo que marca si una hora pertenece al mismo dia (+0, implicito) o al dia siguiente (+1, explicito) respecto al dia de asignacion del turno. Se usa para representar turnos que cruzan medianoche."
    context: Programacion
    date_updated: 2026-09-04
    note: >
      Ampliacion 2026-09-04 (#600/#601, decision del experto, reemplaza la "decision C"): en la
      ORDINARIA, diaOffsetFin se infiere (+1 cuando fin < inicio) y puede venir explicito -- unico
      caso que lo necesita: la franja de 24 h exactas. En las HIJAS (descanso/extra) los offsets
      NUNCA son entrada: se infieren relativos a la franja contenedora (inicio < inicio de la
      franja => dia siguiente; fin < inicio de la hija => cruza) -- con la franja acotada a 24 h
      cada HH:mm tiene un unico dia posible, asi que un offset explicito solo podria coincidir o
      violar contencion. Adentro todo queda con offset (SubFranja lo persiste; ficha y ControlHoras
      lo reciben). Notacion unificada en tools: HH:mm[+N]-HH:mm[+N] (02:00+1-02:30+1).

  - name: Programacion de turnos
    definition: Asignacion de turnos a empleados para periodos especificos.
    context: Programacion

  - name: Solicitud de Programacion
    definition: >
      Peticion de programar un turno a un empleado para un conjunto de fechas. Aggregate propio
      (SolicitudProgramacionAggregateRoot, un stream por solicitud): emite
      ProgramacionTurnoSolicitada y dispara ProgramacionTurnoDiarioSolicitada por fecha hacia
      ControlHoras.
    context: Programacion
    rejected_synonyms: [solicitud de turno]
    rejection_reason: >
      "Solicitud de turno" sugiere pedir un turno (la plantilla del catalogo); lo que se pide es
      PROGRAMAR un turno a un empleado. Rechazado en el refinamiento de #380 (2026-08-14): la ruta
      POST programacion/solicitudes leida completa ya dice "solicitudes de programacion" --
      identico al aggregate; renombrarla habria acunado un tercer nombre para el mismo concepto
      (#380 cerrado not planned, la ruta ya cumplia MEF-ADR-0043).
    date_added: 2026-08-14

  - name: Cancelacion de Programacion
    definition: >
      Acto de cancelar la programacion de uno o varios dias ESPECIFICOS de un colaborador,
      dejandolos sin plan para efectos de calculo (marcaciones posteriores caen en
      TrabajoSinProgramacion). Aggregate propio espejo de la solicitud de programacion: emite
      CancelacionProgramacionSolicitada y dispara CancelacionTurnoDiarioSolicitada por fecha
      hacia ControlHoras, donde el ControlDiario persiste TurnoDiarioCancelado (o hace no-op
      silencioso si el dia no tenia turno). La memoria del acto queda en los streams.
    context: Programacion
    rejected_synonyms: [desprogramar, liberar el dia, retirar el turno del dia, anular, revocar]
    rejection_reason: >
      "Desprogramar" fue elegido primero (simetria con SinProgramar) y revertido por el experto
      a favor de "cancelar programacion" (2026-08-29, #498). "Liberar el dia" es ambiguo con dia
      libre = descanso, que aqui es un turno de pleno derecho. "Retirar el turno del dia"
      colisiona con Retiro de turno (catalogo). NO es deshacer una solicitud previa: esa
      capacidad la compondra el asistente encima de este atomo.
    date_added: 2026-08-29

  - name: FichaTurno
    definition: >
      Vista del catalogo de turnos (primera vista read-side del dominio Programacion, familia
      Ficha*): Id, Nombre, EsDescanso, HorarioResumido, franjas completas y descripcion. La usa
      el Programador (front o asistente) para resolver nombre -> TurnoId y para saber si el
      turno que necesita ya existe. Se BORRA al retirarse el turno: el catalogo visible solo
      muestra lo asignable; la auditoria vive en el event store.
    context: Programacion
    date_added: 2026-08-29
    date_updated: 2026-09-04
    note: >
      Nacida en #496; la invariante de nombre unico (#497, trim + case-insensitive, acentos
      significativos) se verifica best-effort contra esta vista. Ampliacion 2026-09-04 (#607): sigue
      los 9 eventos de Diseno de turno (reemplaza la franja por hora de inicio) y gana Completo
      (derivado de lectura: EsDescanso || franjas > 0). Lee EsDescanso del evento, ya no del conteo.
      Franjas ordenadas por hora de inicio; turno incompleto = "Sin franjas". Sin filtro server-side
      (?completo descartado): el cliente filtra. Lista tambien los incompletos (el resolutor por
      nombre de las tools los necesita).

  - name: Retiro de turno
    definition: >
      Retirar un turno del catalogo = ya no asignable a nuevas solicitudes (TurnoRetirado apaga
      el _estaActivo del aggregate, campo vestigial de HU-4 que gana su primer consumidor). Los
      dias ya programados quedan intactos: la solicitud copia el detalle del turno (snapshot),
      asi que ni pasado ni futuro dependen del catalogo. La ficha se borra de la vista y el
      nombre queda libre. Consecuencia deliberada: "modificar turno" no se construye -- retirar
      + crear de nuevo cubre el caso sin versionado.
    context: Programacion
    date_added: 2026-08-29
    note: "Contrato DELETE programacion/turnos/{id} (paso 3 MEF-ADR-0043, primer DELETE del repo). Quitar dias futuros ya programados es Cancelacion de Programacion, decision separada del Programador."

  - name: Ventana de trabajo
    definition: >
      Marco temporal que el Programador fija para una sesion de programacion ("voy a programar
      agosto", "semana 35"). Es contexto EFIMERO del cliente (front o asistente MCP): se fija
      una vez u obligatoriamente al iniciar, enmarca las demas interacciones de la sesion y
      muere con ella. NO es un concepto del dominio: no se persiste, no tiene identidad,
      ninguna solicitud la referencia. El dominio sigue recibiendo fechas concretas.
      Refuerzo 2026-08-29 (arquitectura MCP): tampoco es estado del servidor MCP -- en
      serverless (scale-to-zero, multiples instancias) la memoria de sesion no es confiable;
      la tool fijar_ventana_de_trabajo se elimino y la ventana vive en la conversacion del
      asistente, que la traduce a fechas concretas en cada tool.
    context: Programacion
    rejected_synonyms: [periodo de programacion persistido, franja temporal]
    rejection_reason: >
      El experto rechazo explicitamente el periodo persistido con tipos y estados (2026-08-29):
      "es algo abierto y efimero... esa decision no se persiste". "Franja temporal" ya esta
      tomado por FranjaTemporal (rango de horas intra-dia en Programacion.DomainEvents). Sin
      guardia de ventana en la solicitud: el enmarcado es responsabilidad del cliente.
    date_added: 2026-08-29
    date_updated: 2026-09-03
    note: >
      Ampliacion 2026-09-03 (sesion planner, #589): en la tool solicitar_programacion_turno la
      ventana es parametro explicito (desde/hasta) con TOPE de 31 dias -- "no es limitar, es
      enmarcar": acota el periodo para mantener el control de colaboradores y dias. Se programan
      TODOS los dias de la ventana recortados por la vigencia de cada colaborador (no existe
      parametro fechas[]; "lunes a viernes" se compone con varias llamadas o sobreescribiendo
      con el turno Descanso -- el ultimo gana). Sigue sin persistirse ni ser estado del servidor.

  - name: Directorio de colaboradores
    definition: >
      Vista read-side del dominio Colaboradores (DirectorioColaborador, una entrada por
      colaborador) hecha para ENCONTRAR a una persona concreta por como la nombran: por nombre o
      parte del nombre sin acentos ni mayusculas ("juan bermudez" encuentra a Juan Pablo Bermudez;
      "juan" a todos los Juanes; token completo, no prefijo), por identificacion completa
      (CC-79879078) o solo por numero de documento (79879078; alfanumericos sin distinguir
      mayusculas; una colision entre tipos devuelve varias entradas y se desambigua en la
      conversacion). Las reglas lexicas se materializan AL PROYECTAR (TokensNombre,
      NumeroDocumento normalizado) y el query compara valores ya normalizados. Acepta una lista de
      identificaciones para re-verificar N colaboradores en una llamada (terna, sede de trabajo,
      vigencia). No filtra por vigencia: la vigencia viaja y el consumidor decide. Endpoint
      QUERY colaboradores/directorio; tool buscar_colaboradores en Consultas.
    context: Colaboradores
    rejected_synonyms: [busqueda de colaboradores (como recurso), colaboradores/fichas/busqueda, extender el QUERY de fichas con reglas lexicas]
    rejection_reason: >
      "busqueda" nombra una accion, no un recurso: el canon REST y naming.md fijan que la ruta
      nombra la vista. Meter nombre/numero en el QUERY de fichas mezclaba reglas lexicas con la
      ficha canonica (lente de GRUPOS: sede de trabajo + etiquetas + fecha de referencia), que
      se conserva intacta. Distinta necesidad de lectura -> vista propia (MEF-ADR-0041).
    date_added: 2026-09-03
    date_updated: 2026-09-03
    note: >
      Nacido en #587. Refinamiento 2026-09-03: se parte en dos, mismo corte que la ficha
      (#356 -> #373): #587 materializa la vista (DirectorioColaborador + proyeccion + indices en
      el worker; sin HTTP) y #590 expone el QUERY colaboradores/directorio (endpoint, registro
      write-side, smoke). Precisiones verificadas en codigo: el Id de la vista YA ES la
      identificacion completa (ComputarStreamId = Identificacion.ToString(), "CC-79879078"), asi
      que no existe campo Identificacion aparte; NumeroDocumento se normaliza con la MISMA
      limpieza que Identificacion.Crear (solo [A-Za-z0-9], mayusculas -- "79.879.078" encuentra
      79879078), no solo trim; la enie colapsa a n al tokenizar (Munoz = Muñoz), como en
      Etiqueta. take fuera de rango se clampea (no 422), como el QUERY de fichas. Consumidores:
      buscar_colaboradores (#588) y solicitar_programacion_turno (#589), ambos dependen de #590.
      Fuera de alcance: prefijos, tolerancia a errores de tipeo.

  - name: Sede de programacion
    definition: >
      Sede donde se REGISTRA la programacion de un turno (la SedeProgramada de la solicitud: Id =
      codigo de la sede, Nombre y CentroDeCostos copiados de FichaSede). La fija el Programador de
      forma explicita y obligatoria al solicitar la programacion via el asistente; no se deriva
      del colaborador. Debe existir y estar activa. Distinta de la Sede del colaborador (sede de
      trabajo, filtro para ENCONTRAR grupos): en la conversacion hay que desambiguar las dos.
    context: Programacion
    rejected_synonyms: [sede (a secas, en la tool), derivarla de la sede del colaborador cuando no se indica]
    rejection_reason: >
      Decision del experto (2026-09-03, #589): "debe fijarle al programador la sede donde se
      registraran las programaciones". El default a la sede del colaborador se habia propuesto
      y se revirtio: la intencion de programar siempre declara donde.
    date_added: 2026-09-03

  - name: Servidor MCP de Consultas
    definition: >
      Superficie MCP remota y serverless del BC para el asistente de composicion asistida:
      tools de SOLO LECTURA, fachadas delgadas y stateless sobre los endpoints HTTP de los
      dominios (cliente HTTP puro, cero referencias a ensamblados del dominio). Un servidor
      MCP se define por BC y por PROPOSITO, nunca por dominio: las recetas del asistente
      cruzan dominios siempre. Su par futuro es el Servidor MCP de Comandos (escritura,
      incrementos 5b/5c), con app y credencial propias: en Azure Functions la system key es
      por app, asi que servidor == credencial == least privilege real (las ToolAnnotations
      del spec son hints, jamas mecanismo de seguridad). Proyecto:
      Bitakora.ControlAsistencia.Mcp.Consultas (#502); infra #508; deploy #509.
    context: Transversal (BC completo)
    rejected_synonyms: [servidor MCP por dominio, Mcp.Operaciones, servidor mixto lectura+escritura]
    rejection_reason: >
      Por dominio: obligaria al cliente a 4 conexiones para cualquier receta util sin reducir
      el tool count. "Operaciones": sin fuente en la literatura; el par canonico es
      Command/Query (CQS de Meyer, CQRS de Greg Young). Mixto: una sola key daria acceso de
      escritura a todo piloto de lectura.
    date_added: 2026-08-29

  - name: Servidor MCP de Comandos
    definition: >
      Par de ESCRITURA del Servidor MCP de Consultas: superficie MCP remota y serverless del BC
      cuyas tools mutan estado invocando los comandos HTTP ya existentes de los dominios
      (cliente HTTP puro, cero referencias a ensamblados del BC; MEF-ADR-0047). Es un Function
      App propio (Bitakora.ControlAsistencia.Mcp.Comandos, func-asist-dev-mcp-comandos) con su
      propia system key, su propia API en APIM ({gateway}/mcp-comandos, validate-jwt del flujo
      Connect de AuthKit) y su propio Resource Indicator en WorkOS: servidor == credencial ==
      least privilege real. Quien lo usa es Claude actuando por un Administrador autenticado; el
      tenant se deriva de org_id/sub del token. Cada tool toma el nombre snake_case del comando
      que envuelve (registrar_sede, registrar_colaborador), publica _meta readOnlyHint:false /
      destructiveHint:false, devuelve un eco compacto del hecho registrado tras el 202 y traduce
      los rechazos 400/409 del dominio a texto util para el asistente (nunca excepcion). Su PRM
      vive en api/.well-known/oauth-protected-resource/mcp-comandos (RFC 9728 s.3) porque el
      path plano ya lo ocupa Consultas en el gateway compartido.
    context: Transversal (BC completo)
    rejected_synonyms: [servidor mixto lectura+escritura, tool que consolida registro y reingreso, fecha_inicio con default "hoy"]
    rejection_reason: >
      Mixto: una sola key daria escritura a todo piloto de lectura. Consolidar reingreso: el
      reingreso (IniciarVinculacion) tiene reglas propias -- fecha posterior a la ultima
      terminacion -- y es otra intencion de negocio; el adaptador no la adivina. Default "hoy":
      es la fecha de un hecho persistido y la migracion trae fechas pasadas; el asistente la pide.
    note: >
      Acunado 2026-09-02 (sesion planner). Cadena de issues: #570 scaffold -> #571 APIM -> #572
      identidad AuthKit (duplicada de Consultas, Rule of Three) -> #573 registrar_sede -> #574
      registrar_colaborador. Limitacion conocida: un cliente MCP que omita el parametro resource
      recibe aud del default (Consultas) y Comandos lo rechaza con 401.
    date_added: 2026-09-02

  - name: Depuracion
    definition: >
      Proceso automatico interno de ControlDiarioAggregateRoot que cruza marcaciones
      con las franjas del turno asignado y produce un ControlFranja por cada franja ordinaria.
      Algoritmo: secuencial por rango. El corte entre franjas adyacentes es el punto
      medio del gap. Primera marcacion en el rango es entrada, ultima es salida,
      intermedias se descartan.
    context: ControlHoras
    date_updated: 2026-08-20
    note: >
      No es un bounded context separado. Es logica interna del aggregate ControlDiario.
      Uso coloquial ampliado (2026-08-17): "la depuracion del dia" nombra el pase automatico
      completo (depurar marcaciones + calcular desglose). Reversion 2026-08-20 (supersede la
      preclasificacion del extinto #422): sin jornada valida que depurar (descanso programado
      o dia sin programar) NO hay depuracion -- las marcaciones quedan crudas, sin
      entrada/salida propuestas y sin desglose: solo la programacion da significado a las
      marcaciones. La anomalia se deriva en el read-side (senal del plan + marcaciones).

  - name: Control de franja
    definition: >
      Objeto rico que combina la franja programada (DetalleFranjaOrdinaria) con la realidad
      operativa (Entrada, Salida). Producido por el depurador de ControlDiario.
      EsAnomala es propiedad calculada (Entrada is null || Salida is null).
      Espeja el patron de naming de ControlDiario: el sistema controla asistencia
      a nivel de dia (ControlDiario) y a nivel de franja (ControlFranja).
      Absorbe calculo de desglose por franja (retardo, tiempo trabajado, conceptos).
    context: ControlHoras
    date_added: 2026-04-16
    date_updated: 2026-04-17
    rejected_synonyms: [MarcacionDepurada, FranjaDelDia, FranjaOperativa, FranjaEvaluada]
    rejection_reason: >
      MarcacionDepurada era una lista separada que requeria correlacion por indice con las franjas,
      rompiendo encapsulamiento. Las alternativas Franja* no capturaban la consistencia con
      ControlDiario ni el verbo del dominio (control).

  - name: Anomalia
    definition: "Caso sospechoso o incompleto detectado automaticamente por el sistema durante la depuracion. Ejemplo: franja con entrada pero sin salida, o dia sin programacion."
    context: ControlHoras
    note: "Termino elegido por su peso estadistico, pensando en escalabilidad futura hacia deteccion por IA"

  - name: Conciliacion
    definition: Proceso manual donde un humano (el Aprobador) resuelve anomalias o corrige resultados de la depuracion.
    context: ControlHoras
    note: "A diferencia de la Depuracion (automatica), la Conciliacion es humana y deliberada. El flujo de aprobacion se define en una sesion futura."

  - name: Discriminacion de horas
    definition: >
      Desglose del tiempo trabajado por concepto legislativo colombiano. El sistema discrimina
      tiempo en minutos, no dinero. Los 3 ejes de clasificacion son: tipo de dia (habil/domingo/festivo),
      banda horaria (diurna 6AM-7PM / nocturna 7PM-6AM), y posicion (dentro/fuera del turno programado).
    context: ControlHoras
    rejected_synonyms: [liquidacion de horas]
    rejection_reason: "liquidacion suena a pago; este sistema solo clasifica tiempo — los porcentajes y valores son responsabilidad del sistema de nomina"
    date_updated: 2026-04-17

  - name: Concepto
    definition: >
      Categoria de clasificacion del tiempo segun legislacion laboral colombiana.
      9 conceptos: OrdinariaDiurna, OrdinariaNocturna, ExtraDiurna, ExtraNocturna,
      DominicalFestivaDiurna, DominicalFestivaNocturna, ExtraDiurnaDominicalFestiva,
      ExtraNocturnaDominicalFestiva, Descanso. Enum cerrado.
    context: ControlHoras
    date_updated: 2026-04-17
    note: >
      Basado en CST reformado por Ley 2466/2025. Banda nocturna: 7PM-6AM (antes 9PM).
      Los recargos son aditivos, no multiplicativos (Circular 0101/2025 Mintrabajo).

  - name: Retardo
    definition: >
      Llegada tarde del empleado respecto al inicio programado de su franja.
      El retardo de una franja puede ser compensado por exceso de tiempo en otra franja del mismo dia.
      Solo despues de compensar todos los retardos, el exceso restante se convierte en horas extras.
      La compensacion es cross-franja a nivel del dia.
    context: ControlHoras
    date_updated: 2026-04-17

  - name: Banda horaria
    definition: >
      Division del dia en dos franjas legales para determinar recargos.
      Diurna: 6:00 AM a 7:00 PM. Nocturna: 7:00 PM a 6:00 AM.
      Definida por Art. 160 CST, modificado por Ley 2466/2025 (antes el limite era 9PM).
      Una franja de trabajo que cruza el limite 7PM se segmenta: la parte antes es diurna, la parte despues es nocturna.
    context: ControlHoras
    date_added: 2026-04-17

  - name: Dia dominical o festivo
    definition: >
      Dia calendario completo (00:00 a 24:00) que genera recargo por trabajo dominical/festivo.
      Incluye todos los domingos y los 18 festivos colombianos (Ley 51/1983).
      El recargo aplica sobre el dia calendario, independientemente de la programacion del turno.
      Si alguien trabaja un domingo, todo el tiempo trabajado ese dia lleva recargo dominical,
      segmentado ademas por banda diurna/nocturna.
    context: ControlHoras
    date_added: 2026-04-17
    note: >
      Art. 179 CST: recargo del 75% (incrementado a 100% gradualmente por Ley 2466/2025:
      80% jul 2025, 90% jul 2026, 100% jul 2027).

  - name: Momento del dia
    definition: >
      Value object atomico que combina una hora (TimeOnly) con un offset de dia (int) para
      representar un instante relativo dentro de un dia de trabajo que puede cruzar medianoche.
      MinutosAbsolutos = Hora.Hour * 60 + Hora.Minute + DiaOffset * 1440.
      Es la representacion canonica en contratos publicos — no se usa DateTime absoluto.
    context: ControlHoras
    date_added: 2026-04-17
    note: "Consolida el patron de 4 campos separados de FranjaTemporal en un tipo atomico comparable."

  - name: Intervalo temporal
    definition: >
      Rango definido por dos MomentoDelDia (Inicio, Fin). Soporta operaciones de interseccion,
      contencion y calculo de duracion en minutos (decimal). Invariante: Inicio < Fin.
      Base para segmentar franjas contra bandas horarias.
    context: ControlHoras
    date_added: 2026-04-17

  - name: Festivo colombiano
    definition: >
      Dia feriado legal en Colombia. 18 por ano: 8 fijos (1 ene, 1 may, 20 jul, 7 ago,
      8 dic, 25 dic, mas 2 religiosos fijos) y 10 movibles trasladados al lunes siguiente
      (Ley 51/1983 - Ley Emiliani). Incluye festivos dependientes de Pascua (Computus).
    context: ControlHoras
    date_added: 2026-04-17

  - name: Jornada
    definition: "Concepto JURIDICO: habla de duraciones y limites legales (jornada maxima, jornada ordinaria). NO es un termino operativo del sistema."
    context: General
    note: "Usar 'Turno' para el concepto operativo. 'Jornada' solo aparece en contextos legislativos."

  - name: DiaCalculado
    definition: >
      Aggregate del dia de un colaborador en el mundo del juicio humano (aprobacion).
      Consume DiaDepurado (bus interno), mantiene los valores provisionales del dia y vive
      el ciclo de vida Provisional -> Aprobado. Stream: "dc:{CodigoColaborador}:{yyyyMMdd}"
      (notacion corregida 2026-08-19 a la anatomia de CA-ADR-0031: separador `:` e ISO 8601
      basico, uniforme con rdm: #419 y cd: #420; el boceto del 2026-08-17 decia
      "dc_..._yyyy-MM-dd" y quedo superado por la decision del 2026-08-18).
      Separado deliberadamente de ControlDiario (calculo automatico): la maquina depura y
      calcula; el humano concilia y aprueba. El juicio humano nunca es sobrescrito por la maquina.
    context: ControlHoras
    date_added: 2026-04-15
    date_updated: 2026-08-17
    note: >
      Termino PROMOVIDO: hasta 2026-08-17 nombraba el evento publico que ControlDiario emitia
      hacia el bus. Ese evento se renombro DiaDepurado (y paso a privado) para ceder el nombre
      al aggregate (issue #421). Sesion planner 2026-08-17.

  - name: Colaborador
    definition: >
      Persona bajo control de asistencia. Existir en el dominio significa "le controlamos
      la asistencia". Independiente del tipo de vinculacion: cubre empleados y, a futuro,
      contratistas — razon por la que se descarto "Empleado" como nombre del concepto rico.
      Aggregate del dominio Colaboradores; stream por Identificacion. El dominio mismo
      anuncia el conjunto ("los colaboradores vigentes") — sin sustantivo intermedio.
    context: Colaboradores
    rejected_synonyms: [Empleado (concepto rico), Plantilla, Planta de personal, Nomina (conjunto), Maestro de colaboradores]
    rejection_reason: >
      Empleado excluye contratistas. Plantilla es lexico de Espana/futbol, no laboral colombiano
      (acepcion "planta de personal"; la acepcion "molde reutilizable" SI se adopto el 2026-09-04
      para Plantilla de turnos -- no hay contradiccion).
      "Planta" en Colombia connota empleado permanente (excluiria contratistas). Nomina ya nombra
      al sistema externo downstream. "Maestro de X" crearia un canon de maestros ("maestro de todo").
    note: >
      Proscripcion operativa (sesion 2026-08-15): "Empleado" no fue liberado sino proscrito --
      se elimina de todos los artefactos del codigo: nombres de tipo (#340) y claves de
      propiedad/contratos (#401). El identificador que fluye por Programacion y ControlHoras ES
      el CodigoColaborador del maestro (unificado; los downstream lo reciben como string plano,
      el invariante URL-safe vive en el VO del maestro). Criterio de nombres consolidado
      (diverge de #319 "nombre puro del lenguaje ubicuo"; constancia aqui y en los remarks de
      los tipos, sin ADR por decision del usuario): los payloads parciales por rol llevan
      calificador de intencion -- ColaboradorProgramado, InformacionColaborador,
      DetalleColaborador -- porque el nombre puro se reserva al concepto rico (mismo
      anti-squatting que SedeProgramada, #331/#336).
    date_added: 2026-08-10

  - name: Vinculacion
    definition: >
      Periodo durante el cual un colaborador esta bajo control de asistencia. Vive DENTRO del
      aggregate Colaborador (vocabulario interno write-side: no cruza la frontera del dominio;
      lo que sale es Colaborador con el codigo de su vinculacion vigente aplanado). Maximo una
      vigente por colaborador; las vinculaciones no se solapan (invariante). Se abre con
      VinculacionIniciada (registro o reingreso) y se cierra con VinculacionTerminada.
    context: Colaboradores
    rejected_synonyms: [Contrato, PeriodoDeControl]
    rejection_reason: >
      Contrato miente: el promovido fuera del control conserva su contrato laboral — lo que
      termina es la sujecion al control, no el contrato. Vinculacion ademas es lexico laboral
      colombiano corriente (tipo de vinculacion, fecha de vinculacion) y cubre contratistas.
    date_added: 2026-08-10
    date_updated: 2026-08-14
    note: >
      Descubrimiento 2026-08-13 (sesion doctrina HTTP): el reingreso NO es un hecho distinto --
      Reingresar emite el mismo VinculacionIniciada que el registro; el dominio ya unifico el hecho.
      "Reingreso" nombra el ESCENARIO ("el reingreso nace limpio"), no un comando. Decidido
      (#378 refinado 2026-08-14, doctrina MEF-ADR-0043 aceptada): rename a IniciarVinculacion con
      simetria completa -- comando, metodo del aggregate y enum de resultado -- y ruta
      POST colaboradores/{id}/vinculaciones (paso 1: create disfrazado); el cliente no declara
      lo que el servidor deriva de la historia del stream.

  - name: CodigoColaborador
    definition: >
      Id TRANSACCIONAL del colaborador: el codigo asignado por el sistema externo a la
      vinculacion, bajo el cual ocurren las transacciones a su nombre (marcaciones, turnos).
      Pertenece a la vinculacion — un recontratado puede estrenar codigo. Naming por posicion:
      Codigo dentro de la Vinculacion o de un objeto colaborador anidado; CodigoColaborador
      cuando viaja aplanado en payloads. Reemplaza a EmpleadoId en el BC (#340).
    context: Colaboradores
    rejected_synonyms: [EmpleadoId, VinculacionId, IdExterno, IdExternoColaborador]
    rejection_reason: >
      EmpleadoId embarraba dos identidades (persona y transaccion) y excluye contratistas.
      VinculacionId fallo la prueba de voz ("nadie lo diria en la vida"). IdExterno queda mudo
      (externo a que?). La gente dice "el codigo".
    note: >
      NO confundir con la Identificacion: el codigo transacciona, la identificacion identifica a
      la persona (streamId). Invariante URL-safe (#387, 2026-08-14): se RECHAZA (400) todo codigo
      con caracteres fuera del set unreserved de RFC 3986 (A-Z a-z 0-9 - . _ ~); ":" queda fuera
      ademas por ser el separador de accion (MEF-ADR-0043). Nunca se limpia ni normaliza -- el
      codigo lo asigna la empresa (dato ajeno), a diferencia del numero de la Identificacion
      (#381), que el dominio SI normaliza para unificar identidad. Case preservado, comparaciones
      exactas.
    date_added: 2026-08-10
    date_updated: 2026-08-14

  - name: Identificacion
    definition: >
      Identidad civil de la persona: {TipoIdentificacion}-{NumeroIdentificacion} (separador
      GUION desde #381; el ":" original era problematico como segmento de URI). Es el
      streamId del aggregate Colaborador (por tenant). Tipo: lista cerrada estilo PILA
      (CC, CE, TI, PA, PT) como VO sin sombra numerica — lo persistido es siempre el codigo
      literal. Numero: string ALFANUMERICO limpiado como invariante del VO — solo [A-Z0-9]:
      letras a MAYUSCULAS, cualquier otro caracter se ELIMINA sin error (se limpia antes de
      registrar, no se rechaza); vacio tras la limpieza si es error. La limpieza es lo que
      hace del guion un separador inequivoco (post-limpieza el numero jamas contiene "-").
      Si nace errada: cerrar el stream errado y abrir el correcto (protocolo aceptado; la
      "basura" de streams cerrados es tolerable y un stream puede reutilizarse con el dueno
      legitimo via CorregirNombres).
    context: Colaboradores
    date_added: 2026-08-10
    date_updated: 2026-08-14

  - name: ResumenColaborador
    definition: >
      Payload por rol reducido del colaborador que viaja en eventos privados intra-BC.
      Vive en PrivateEvents/Colaboradores (namespace del dominio DUENO del concepto,
      espejo de PublicEvents/Colaboradores). Terna de identidad, paridad con la cabecera
      de FichaColaborador: Identificacion (stream key del maestro, "{Tipo}-{Numero}"),
      CodigoColaborador y NombreCompleto (un solo campo, ya concatenado). Nace en #421
      para DiaDepurado; #433 (borrador) adelgaza el resto de la cadena de programacion
      hacia el, reemplazando el quinteto de DetalleColaborador / ColaboradorProgramado /
      InformacionColaborador.
    context: Colaboradores
    date_added: 2026-08-20
    rejected_synonyms: [DetalleColaborador (quinteto legacy, ns Programacion), llevar solo CodigoColaborador]
    rejection_reason: >
      Reducir, no eliminar (sesion 2026-08-19/20): los eventos llevan la foto del
      colaborador porque la verdad viaja en el evento, no el maestro -- definicion del
      proyecto; que exista NombresCorregidos en el maestro no invalida la foto historica.
      TipoIdentificacion y NumeroIdentificacion por separado tienen cero consumidores en
      todo el sistema; la Identificacion compuesta es el stream key del maestro y si
      sirve para correlacionar.

  - name: Etiqueta
    definition: >
      Par categoria:valor libre definido por el cliente para segmentar colaboradores en
      reportes (cargo:desarrollador, area:Tecnologia). Sin catalogo previo: nace al asignarse.
      Un valor por categoria (asignar sobrescribe). Pertenece a la VINCULACION vigente, no a
      la persona (priman las laborales; el reingreso nace limpio: huecos visibles en vez de
      mentiras silenciosas; se descarto la taxonomia personal/laboral por incompatible con
      categorias dinamicas). Doble forma: original (display) + normalizada (identidad, sin
      tildes/mayusculas) — la normalizacion es invariante del VO, no truco de base de datos.
    context: Colaboradores
    rejected_synonyms: [Tag, Atributo]
    rejection_reason: "Tag es anglicismo; Atributo suena a campo estructural, no a clasificacion libre."
    date_added: 2026-08-10

  - name: CategoriaDeEtiquetas
    definition: >
      Vista read-side (MEF-ADR-0041): una categoria de etiquetas EN USO con sus valores distintos,
      para el autocompletado de la UI de etiquetado/filtrado (frena la fragmentacion por la via
      humana: el usuario elige lo existente en vez de teclear variantes). Un documento por
      categoria: Id = categoria normalizada; display "la ultima gana" (cada EtiquetaAsignada
      refresca la forma original mostrada, tanto de la categoria como de los valores); valores
      con forma display + normalizada para el matcheo. Catalogo ACUMULATIVO: solo EtiquetaAsignada
      alimenta, nada sale -- EtiquetaRetirada no descuenta (no trae el valor; la sobrescritura y
      el reingreso-limpio son retiros implicitos que exigirian estado por colaborador, sin
      beneficio para el proposito).
    context: Colaboradores
    rejected_synonyms: [Etiqueta (como nombre de vista), EtiquetasEnUso, SugerenciaDeEtiquetas]
    rejection_reason: >
      Etiqueta colisiona con el VO de DomainEvents (guardrail anti-homonimia). EtiquetasEnUso
      nombra el conjunto, pero el documento individual es una categoria. SugerenciaDeEtiquetas
      acopla la vista a un consumidor concreto.
    date_added: 2026-08-13
    note: "Issue #357. Receta N2 (MultiStreamProjection), la primera del BC. Sin sufijo de implementacion."

  - name: Vigencia
    definition: >
      Estado de la vinculacion evaluado CONTRA UNA FECHA (default: el hoy de quien consulta,
      parametrizable). No existe booleano activo/inactivo materializado — necesitaria eventos
      de reloj (el preaviso voltea el dia 30 sin evento). El read model materializa hechos:
      VigenteDesde/VigenteHasta con centinela 9999-12-31 para vinculacion abierta; la consulta
      resuelve VigenteHasta >= fechaReferencia (un rango indexable). Las operaciones del
      dominio exigen vinculacion vigente hoy; las vacantes/ausencias se valoran contra vigentes.
    context: Colaboradores
    date_added: 2026-08-10

  - name: Tiempo del hecho / tiempo de registro
    definition: >
      Principio bitemporal del BC: el tiempo de los HECHOS (fechas de vinculacion, timestamps
      de marcacion) viene SIEMPRE de afuera — del cliente/fuente, requerido, jamas del reloj
      del servidor. El sistema solo aporta el tiempo de REGISTRO (timestamp del evento en el
      event store, automatico): cuando se entero — auditoria, nunca semantica de negocio.
      Consecuencias: preaviso (hecho futuro registrado hoy) y carga tardia (hecho pasado
      registrado hoy) son el mismo fenomeno; el sistema es agnostico al timing de las fuentes
      porque no confunde llegada con ocurrencia.
    context: General
    date_added: 2026-08-10

  - name: Fecha de referencia
    definition: >
      La fecha contra la que una consulta read-side evalua la vigencia (VigenteHasta >=
      fechaReferencia). SIEMPRE explicita del consumidor, jamas resuelta por el sistema:
      el "hoy" lo determina quien consulta (front o adaptador) en SU zona horaria.
      Instancia read-side del principio "Tiempo del hecho / tiempo de registro" y del
      precedente de determinismo de RangoConsulta (misma consulta, mismo resultado, sin
      importar cuando se ejecute). Un default UTC del servidor seria incorrecto para
      Colombia (UTC-5) desde las ~19:00 hora local; zona horaria por tenant es un concepto
      que no existe y no se introduce sin caso real (Rule of Three).
    context: General
    rejected_synonyms: [hoy del servidor, fecha actual, fecha de corte]
    rejection_reason: "hoy/fecha actual esconden la pregunta 'hoy de quien'; fecha de corte sugiere cierre contable, que no es"
    date_added: 2026-08-12

  - name: Provisional
    definition: >
      Estado inicial del DiaCalculado: los numeros del dia aun se mueven solos (cada
      DiaDepurado que llega los actualiza). Le dice al Aprobador que no actue sobre
      ellos como finales.
    context: ControlHoras
    date_added: 2026-08-17
    rejected_synonyms: [Abierto, Por aprobar, Borrador, En calculo, Causado]
    rejection_reason: >
      Abierto/Cerrado no dicen que hubo juicio humano; Por aprobar define por carencia;
      Borrador implica redaccion humana; En calculo suena a proceso corriendo; Causado
      es contable y esto no es una realidad contable.

  - name: Aprobado
    definition: >
      Estado del DiaCalculado tras el acto del Aprobador. El dia queda en firme: sus
      valores ya no cambian automaticamente ante nuevas marcaciones o programaciones.
      Sobre un dia con datos atestigua "lo que paso esta bien calculado"; sobre un dia
      vacio atestigua "no vino y no debia venir" (aval a la ausencia de programacion,
      decision 2026-08-17: el aval del vacio crea el stream con DiaAprobado como primer evento).
    context: ControlHoras
    date_added: 2026-08-17
    note: >
      Cadena de naming: Aprobador -> AprobarDia -> DiaAprobado -> Aprobado (MEF-ADR-0005).
      "En firme" sobrevive como prosa, no como nombre de estado. El ciclo no termina aqui:
      hay al menos un estado posterior a la transmision, deliberadamente sin bautizar.
      Principio (2026-08-29): las aprobaciones son DEFINITIVAS — lo aprobado paso por
      juicio humano y no se revisa; toda decision que exija juicio (ej. conflicto de
      sede) se toma EN el acto de aprobar, nunca antes sobre datos provisionales.
      Refinamiento #489 (2026-08-29): el acto aprueba el DIA COMPLETO; la decision
      explicita solo aplica a franjas en conflicto (el resto se avala implicito, como
      el aval del vacio avala la ausencia). Re-aprobar declina (409): la definitividad
      hace del segundo acto un error, no un retry. Sin identidad del aprobador (endpoints
      anonimos: un campo autoafirmado seria evidencia debil; se versionara el evento con
      autenticacion real, MEF-ADR-0005). Fotos tardias: no mueven el dia -- #489 las
      ignora (guarda minima) y #491 las archiva como DepuracionPosAprobacionRecibida.

  - name: Conflicto de sede
    definition: >
      Discrepancia por franja entre la sede programada (estampada por la programacion)
      y la sede marcada (resuelta desde el dispositivo de la marcacion). Sin default:
      el Aprobador decide cual vale, eligiendo solo entre las dos candidatas. Mientras
      este pendiente, el dia no es aprobable. El CC sigue automatico a la sede elegida.
    context: ControlHoras
    date_added: 2026-08-29
    note: >
      Granularidad por franja: un colaborador puede trabajar en dos sedes el mismo dia.
      Solo una fuente presente no es conflicto: se hereda la unica disponible.
      Candidatas (decision 2026-08-29): programada + sede de entrada + sede de salida
      (la entrada y la salida pueden venir de sedes distintas) -- el Aprobador elige
      entre TODAS las presentes (2 o 3). Misma sede con CC distinto entre fuentes NO
      es conflicto: prevalece el CC estampado en la marcacion, nunca lookup al maestro.
      Deteccion: estado derivado de la ultima foto en el expediente (#482, no evento
      persistido). Resolucion (decision 2026-08-29, aprobaciones definitivas): NO es
      comando independiente — la sede elegida viaja en el payload de AprobarDia (#489),
      en el mismo acto que quita el estatus Provisional; aprobar con conflictos sin
      decidir declina. #483 cerrado not planned por este principio.
      Refinamiento #489 (2026-08-29): la franja se referencia por HoraInicioProgramada
      (clave natural, unica dentro del dia); el comando trae solo el codigo elegido y el
      aggregate lo resuelve a la candidata completa (nombre + CC del estampado de su
      fuente) que persiste dentro de DiaAprobado -- nunca evento de resolucion aparte.
      Declinan 409: sede no candidata, y decision para franja sin conflicto o inexistente
      (protege contra front desincronizado). La vista apaga ConflictoDeSedePendiente al
      proyectar DiaAprobado (#492).

  - name: DiaDepurado
    definition: >
      Evento privado (bus interno del BC) que ControlDiario publica en cada recalculo.
      La voz de la maquina: "depure el dia". Payload plano y portable: senal del plan
      estructural sin enum (NombreTurno? + franjas: null = sin programacion; nombre +
      cero franjas = descanso; nombre + franjas = jornada valida), franjas con plan
      (inicio/fin/offset) y realidad (entrada/salida/anomalia), TODAS las marcaciones
      del dia crudas y en orden cronologico ascendente (contrato del evento; sin marca
      usada/descartada: el receptor la deriva por igualdad de timestamp con
      entrada/salida), y HorasPorConcepto en horas liquidables. Consumido por el
      aggregate DiaCalculado. Aqui ocurre la transformacion unica minutos -> horas.
    context: ControlHoras
    date_added: 2026-08-17
    rejected_synonyms: [DiaCalculado (como evento), DiaRecalculado, CalculoDelDiaActualizado]
    rejection_reason: >
      DiaCalculado cedio el nombre al aggregate; DiaRecalculado rozaba con la familia
      "calculado" cruzando la frontera maquina/humano. Depurado ancla en la familia
      lexica de la maquina (Depuracion automatica vs Conciliacion humana).
    date_updated: 2026-08-20
    note: >
      Refinamiento #421 (2026-08-20): nace con payload MINIMO -- CodigoColaborador
      top-level (siempre presente, identidad del dia; corrige que DiaCalculado no
      identificaba al colaborador cuando viajaba sin turno asignado), Fecha,
      ResumenColaborador? (la foto; null si el dia nacio solo por marcacion) y
      HorasDiscriminadas. El payload enriquecido de la definicion llega con #424.
      Reversion 2026-08-20: el "bloque huerfano preclasificado" salio del payload
      (extinto #422); la anomalia del dia sin jornada valida la deriva el receptor.
      Refinamiento #424 (2026-08-20): payload final cerrado -- lookup a demanda de
      marcaciones contra ControlDiario descartado (atomicidad expediente-veredicto:
      el Aprobador juzga la misma foto que produjo las horas); franja minima
      plan+realidad, sin sede (fuera de la conversacion por ahora) ni descansos/extras
      internos (ya digeridos en HorasPorConcepto); #424 no depende de #423 (el
      contrato soporta el descanso estructuralmente: nombre + cero franjas).

  - name: DepuracionDiaRecibida
    definition: >
      Evento persistido del aggregate DiaCalculado: "la depuracion del dia fue recibida".
      Primer evento de dominio de su stream (cuando el dia nace por datos). El handler
      traduce DiaDepurado (bus) a este evento (patron RegistroDeMarcacionCreado ->
      MarcacionAdicionada). Genero: el participio concuerda con el nucleo "Depuracion"
      (femenino) -- precedente ProgramacionTurnoSolicitada.
    context: ControlHoras
    date_added: 2026-08-17

  - name: DepuracionPosAprobacionRecibida
    definition: >
      Evento persistido del aggregate DiaCalculado: una depuracion (DiaDepurado) que llego
      DESPUES de aprobar el dia, archivada como evidencia en el mismo stream dc:. Carga la
      foto completa (franjas, marcaciones, horas) para que la auditoria vea QUE decia la
      depuracion que no se incorporo. Su Apply no muta nada: el dia aprobado no se mueve.
    context: ControlHoras
    date_added: 2026-08-29
    rejected_synonyms: [DepuracionDescartada]
    rejection_reason: >
      No se descarta: se archiva como evidencia. Es el insumo natural de la conciliacion
      futura ("conciliar" y "reabrir" siguen sin disenar). Issue #491; la proyeccion
      AsistenciaDiaria lo ignora deliberadamente (#492).

  - name: AsistenciaDiaria
    definition: >
      Vista (read model) del Aprobador: una fila liviana por colaborador+dia con la
      superficie de DECISION en dos ejes -- Plan (ConJornada/Descanso/SinProgramar +
      NombreTurno) y anomalias ya juzgadas (NoSePresento, FranjasIncompletas,
      VinoEnDescanso, TrabajoSinProgramacion, ConflictoDeSedePendiente) -- mas Estado y
      HorasPorConcepto sparse.
      La superficie de INVESTIGACION (franjas, marcaciones) NO se materializa: se lee
      en vivo hidratando el aggregate DiaCalculado. Proyeccion N1 sobre el stream dc:.
    context: ControlHoras
    date_added: 2026-08-17
    note: >
      Criterio de diseno (2026-08-17): se materializa la superficie de decision; la de
      investigacion se lee en vivo. El resumen del periodo se agrega en query-time sobre
      estas filas (el periodo es arbitrario, no se pre-materializa).
      Refinamiento 2026-08-24 (#426): las banderas crudas del borrador se reemplazan por
      los dos ejes del Aprobador -- la derivacion vive una sola vez en la proyeccion
      (MEF-ADR-0041); UltimaDepuracion retirado (ninguna decision del Aprobador lo
      justifica); NumeroMarcaciones descartado (el contexto de investigacion es #429).
      Refinamiento 2026-08-29 (#485): quinta bandera ConflictoDeSedePendiente -- la proyeccion
      re-deriva SOLO el booleano desde la foto (segunda aparicion de la politica de conflicto,
      MEF-ADR-0018); el detalle por franja (candidatas, sede efectiva) sigue siendo superficie
      de investigacion en vivo (#482).

  - name: Dia sin programar
    definition: >
      Dia para el que el Programador no definio ni turno ni descanso. Siempre anomalo:
      alli falta una decision de planeacion. Con marcaciones produce la anomalia
      "Trabajo sin programacion" (las marcaciones quedan crudas, sin desglose: solo la
      programacion les da significado -- reversion 2026-08-20 de la presuncion de trabajo
      ordinario); vacio, es avalable por el Aprobador ("no vino y no debia venir").
    context: ControlHoras
    date_added: 2026-08-17
    date_updated: 2026-08-20
    rejected_synonyms: [hueco, dia vacio]
    rejection_reason: "hueco es jerga sin dignidad de dominio; vacio confunde con el dia sin marcaciones"

  - name: Hora liquidable
    definition: >
      Unidad del mundo humano (aprobacion, vistas, nomina): horas y fraccion decimal
      (hoy 2 posiciones). El mundo maquina (ControlDiario) calcula y persiste en minutos
      enteros; la conversion ocurre UNA sola vez, al construir DiaDepurado, con la
      precision como constante interna centralizada (nunca configurable por vista).
    context: ControlHoras
    date_added: 2026-08-17
    date_updated: 2026-08-20
    note: >
      Consecuencia asumida: los totales de periodo son suma de valores redondeados por
      concepto-dia. Precision CERRADA en 2 (decision del humano, refinamiento #424):
      constante NOMBRADA dentro del tipo HorasLiquidables, nunca literal suelto; si una
      valoracion de negocio futura dicta otra, se cambia en un solo lugar.

  - name: Etiquetas de anomalia
    definition: >
      Vocabulario acordado para las celdas anomalas de la matriz plan x realidad:
      "No se presento" (turno programado, sin marcaciones), "Franja incompleta"
      (entrada sin salida), "Vino en descanso" (marcaciones sobre descanso programado),
      "Trabajo sin programacion" (marcaciones en dia sin programar). El dia vacio con
      descanso programado NO es anomalia (descanso como debia); el dia sin programar
      siempre lo es.
    context: ControlHoras
    date_added: 2026-08-17
    date_updated: 2026-08-20
    note: >
      'Trabajo sin programacion' y no 'trabajo sin programar': lo ausente es la
      programacion (sustantivo), no un verbo omitido por el colaborador.
      Reversion 2026-08-20 (supersede la decision 7 del 2026-08-17): las etiquetas NO
      preclasifican a conceptos legales -- sin jornada valida las marcaciones quedan
      crudas. Aprobar el dia anomalo = no reconocer esas marcaciones; si la anomalia
      revela un error de programacion, la correccion legitima es reprogramar (el
      recalculo es automatico, "el ultimo gana").

  - name: Sede
    definition: >
      Lugar de trabajo. Distribuye a los colaboradores geoespacialmente (cadenas de
      restaurantes/comercio) y, opcionalmente, define el centro de costos de las horas
      trabajadas alli. Aggregate del dominio Sedes (Function App hermana de Colaboradores,
      dentro del BC -- no un BC aparte); stream por CodigoSede. Nace solo con codigo y
      nombre obligatorios; ciudad y direccion son opcionales e informativas (sin impacto
      en calculos). Bandera Activa: gobierna unicamente la asignabilidad (a un turno o a
      un colaborador) via filtro del read model -- sin rechazo en el servidor; la sede
      inactiva sigue siendo editable. Los dispositivos de marcacion son entidades internas
      del aggregate (un dispositivo no existe sin sede -> no es aggregate root):
      DispositivoInstalado / DispositivoRetirado; el traslado entre sedes se resuelve
      con esos dos hechos -- sin comando de traslado (ratificado 2026-08-29); la
      exclusividad cross-sede es invariante best-effort del command handler contra
      UbicacionDispositivo (#477: 409 al instalar donde ya esta en otra sede; la carrera
      residual la tolera la recencia de #475). Desactivar una sede NO retira sus
      dispositivos (retirar es decision operativa separada y explicita) y en una sede
      inactiva se puede instalar y retirar. El nombre puro estaba reservado desde #331/#336 (anti-squatting de
      SedeProgramada); esta sesion lo reclama para el concepto rico.
    context: Sedes
    date_added: 2026-08-27
    date_updated: 2026-08-29
    note: >
      NombreSedeModificado y no 'Corregido': el nombre de una sede cambia legitimamente
      (rebranding), no solo por error. Issues #455-#461 (sesion 2026-08-27).

  - name: CodigoSede
    definition: >
      Identidad de la sede: la trae el cliente (nunca un Guid nuestro), hermana de
      CodigoColaborador, con la misma invariante URL-safe cuando sea segmento de ruta
      (sedes/{codigo}). Es el stream id del aggregate Sede y debe poder casar con los
      ids opacos que ya circulan en SedeProgramada.Id (#331).
    context: Sedes
    date_added: 2026-08-27

  - name: Centro de costos
    definition: >
      String opaco dado por el cliente (mismo trato que DispositivoId): nosotros
      estampamos, el sistema contable del cliente interpreta. Opcional en la sede -- no
      todos los negocios costean por lugar de trabajo. Rige desde que se asigna (sin
      vigencias programadas ni retroactivas: problema del futuro) y es retirable (la sede
      vuelve a 'sin CC' y sus liquidaciones futuras salen sin el). Las modificaciones al
      maestro nunca cambian los hechos ya estampados.
    context: Sedes
    date_added: 2026-08-27

  - name: Estampado
    definition: >
      Doctrina (sesion 2026-08-27, revisada el mismo dia en el refinamiento): la verdad
      viaja en el evento y el maestro es la referencia para el estampado. El estampado
      ocurre en cada hecho de entrada desde el API -- NUNCA al depurar: depurar es un
      resultado que hereda lo estampado aguas arriba. Al PROGRAMAR, la sede y su CC los
      construye el FRONT (consultando FichaSede) y los envia; el servidor los graba SIN
      validacion interna (fiel a #331: el cliente resuelve, el servidor graba el snapshot).
      Al MARCAR no hay front (el biometrico solo manda DispositivoId): el dato llega por
      enriquecimiento coreografiado por el dueno (ver termino) y ControlHoras lo graba como
      hecho propio, segundos despues. Las modificaciones al maestro nunca cambian hechos ya
      estampados.
    context: General
    date_added: 2026-08-27
    date_updated: 2026-08-29
    note: >
      Revision del experto: se descarto que el servidor resolviera el CC via vista local
      del maestro (version inicial de la sesion) -- en programacion el CC viaja desde el
      front como campo aditivo de SedeProgramada (#462, que absorbio a #466); en marcacion
      resuelve el dueno (#467/#463). Refinamiento 2026-08-29 (#463): el estampado de
      marcacion va SOLO al stream cd: (la depuracion es su consumidor y solo ve el
      ControlDiario) con traslape nocturno heredado, como SedeDeMarcacionIdentificada;
      rdm: descartado (sin consumidor de costeo, y su clave usa el timestamp crudo que
      no viaja por el bus).

  - name: FichaSede
    definition: >
      Vista materializada del maestro de sedes (read model, #461): Codigo, Nombre, Ciudad,
      Direccion, CentroDeCostos vigente (null si retirado), Activa y la lista de
      Dispositivos instalados. Consumidores: el administrador del maestro y las pantallas
      de asignacion (solo activas); ademas es la fuente del FRONT para construir el CC al
      programar (#462) y el read model que el resolver de marcaciones consulta (#467).
      Receta N1, lifecycle Async, SIN paginacion (coleccion acotada, decision del experto).
      Espejo nominal del precedente FichaColaborador.
    context: Sedes
    date_added: 2026-08-27

  - name: UbicacionDispositivo
    definition: >
      Vista materializada minima (read model, #475): Id = DispositivoId, SedeId. Responde
      "en que sede esta instalado este dispositivo" para el resolver de marcaciones (#467).
      Solo la ubicacion VIGENTE: el ultimo DispositivoInstalado aplicado gana (la recencia
      la da el orden de la secuencia global del event store, sin fecha persistida -- el
      experto descarto InstaladoEl); el retiro de la sede vigente borra el documento SIN
      fallback a instalaciones fantasma anteriores (la correccion es arreglar el maestro);
      el retiro de una sede no vigente se ignora. SedeId es el stream key (s:{codigo}) para
      cargar FichaSede por Id sin partir strings (MEF-ADR-0037/CA-ADR-0031). Receta N2
      (MultiStreamProjection por DispositivoId: correlaciona streams de varias sedes),
      lifecycle Async, sin Function GET (consumo interno, YAGNI).
    context: Sedes
    date_added: 2026-08-29

  - name: Enriquecimiento coreografiado por el dueno
    definition: >
      Patron adoptado (sesion 2026-08-27) para cuando un dominio necesita datos cuya
      verdad pertenece a otro y no hay front que los resuelva (la marcacion del biometrico
      necesita sede/CC del dispositivo). El hecho crudo del consumidor ya cruza el bus
      (RegistroDeMarcacionCreado); el DUENO (Sedes) reacciona, consulta su propio read
      model (FichaSede) y publica el resultado autocontenido (SedeDeMarcacionResuelta); el
      consumidor lo graba como hecho propio en su stream (SedeDeMarcacionIdentificada).
      Es el patron Content Enricher (Hohpe & Woolf, Enterprise Integration Patterns),
      aplicado con el dueno del dato como estacion de enriquecimiento.
    context: General
    rejected_synonyms: [replica local de estado ajeno, vista local de datos ajenos]
    rejection_reason: >
      La replica local (Event-Carried State Transfer, Fowler 2017) se descarto
      explicitamente: exige maquinaria de sincronizacion permanente (reconciliacion
      periodica, backfill, tombstones, monitoreo de drift -- Kleppmann DDIA cap. 5) y su
      modo de falla es una replica desactualizada en silencio; la coreografia consulta la
      verdad viva del dueno y falla de forma visible (retries/DLQ). Queda como ultimo
      recurso con costo declarado.
    date_added: 2026-08-27
    date_updated: 2026-08-29
    note: >
      Opcion preferida para casos futuros; YA es canon del marco: MEF-ADR-0046
      (harness#747 cerrado 2026-08-28) -- #467 lo referencia en vez de un CA-ADR local.
      Refinamiento 2026-08-29: SedeDeMarcacionResuelta viaja plano (6 campos top-level,
      terna de correlacion + estampado) y se publica con groupId=CodigoColaborador
      (fan-in con queue de sesion en el consumidor, MEF-ADR-0026); entre topics
      distintos la mitigacion es concurrencia optimista + retry.

  - term: Tenant (empresa cliente)
    definition: >
      Cada empresa cliente del producto. Se materializa como una organizacion de WorkOS
      (fuente del claim tenant_id del JWT) y como la particion conjoined del event store:
      todo dato vive acotado a su tenant (MEF-ADR-0028 etapa b). Los administradores de la
      empresa son miembros de su organizacion WorkOS.
    note: >
      Acunado 2026-08-31 (sesion planner, adopcion WorkOS + multi-tenancy). El tenant
      sintetico "tenant-smoke" es operativo (smoke tests), no un tenant de negocio. El MCP
      opera interino bajo un tenant fijo hasta #540.

# -------------------------
# ACTORES DEL SISTEMA
# Los roles son del sistema, no cargos organizacionales.
# Pueden recaer en la misma persona.
# -------------------------
actors:
  - name: Programador de turnos
    type: user
    definition: Persona responsable de garantizar la cobertura operativa de uno o mas sitios de trabajo.
    responsibilities:
      - Definir turnos con sus franjas (ordinarias, descansos, extras)
      - Componer plantillas semanales de turnos (moldes reutilizables de 1..N semanas) a partir del catalogo (2026-09-04, CA-ADR-0034)
      - Asignar turnos a empleados para periodos especificos
      - Garantizar cobertura operativa del sitio
      - Cumplir limites legales de jornada laboral maxima y trabajo suplementario
    interacts_with: [Programacion]
    note: >
      Ampliacion 2026-08-29 (sesion planner): el rol puede ser un departamento centralizado
      especializado o federado en cada sede, con personas asignadas o flotantes. Su
      responsabilidad de fondo es optimizar las necesidades de los servicios con los
      colaboradores en los distintos puntos de trabajo -- la demanda (necesidades por punto
      de trabajo) y la oferta (disponibilidad de colaboradores) aun NO son conceptos del
      sistema; se exploraran despues de resolver la operacion basica (decision del experto).

  - name: Aprobador
    type: user
    definition: Persona que revisa los resultados de la depuracion, atiende anomalias y da el visto bueno para la transmision a nomina.
    responsibilities:
      - Revisar resultados de la depuracion automatica
      - Resolver anomalias mediante conciliacion
      - Aprobar el lote de horas discriminadas para transmision al sistema de nomina
    frustrations:
      - Tener que verificar manualmente cada empleado por no confiar en el sistema automatico
    interacts_with: [ControlHoras]
    note: >
      Puede ser la misma persona que el Programador de turnos.
      Resolucion 2026-08-17: aprobar y transmitir son actos distintos en momentos distintos.
      El Aprobador aprueba dia a dia cuando lo desea (deja el dia en firme: estado Aprobado
      del aggregate DiaCalculado); la transmision a nomina es otro acto, posterior, aun sin
      disenar. La nota anterior ("el unico lote es al transmitir") aplicaba solo a la transmision.

  - name: Colaborador (actor)
    type: user
    definition: La persona cuya asistencia se controla. Antes "Empleado" -- termino proscrito del lenguaje ubicuo (#330, proscripcion operativa 2026-08-15).
    responsibilities:
      - Registrar sus marcaciones de entrada y salida
    note: "Usuario directo solo cuando se construya el modulo de registro propio. Actualmente, sus marcaciones llegan via Sistema de marcacion externo. Pregunta 'como le llamamos en el dominio?': resuelta en #330 -- colaborador."
    interacts_with: []
    open_questions:
  - question: "Asignacion de una Plantilla semanal de turnos a un colaborador: acotada (desde/hasta) o abierta (hasta nuevo aviso)? Debe el rango arrancar en lunes (409, alinear, o tolerar)? Se registra el hecho 'tiene la plantilla X' (aggregate propio) o solo se desdobla en solicitudes por fecha? El experto lo saco del foco de la sesion de construccion (2026-09-04)."
    context: Programacion
    date: 2026-09-04
    priority: high
  - question: "Modalidad ciclica de Plantilla de turnos (4x2, 2x2, 6x1 con descanso que corre): hay clientes que la necesiten? Seria otro aggregate con dias por posicion, anclado a una fecha al asignar."
    context: Programacion
    date: 2026-09-04
    priority: low
      - "Que datos del colaborador nos importan para el control de asistencia?"

  - name: Administrador
    type: user
    definition: >
      Persona de una empresa cliente que se autentica con WorkOS (miembro de su organizacion)
      y opera el producto; mientras no existan dispositivos, tambien carga marcaciones. Es hoy
      el UNICO tipo de usuario autenticado del sistema.
    interacts_with: [Programacion, ControlHoras, Sedes, Colaboradores]
    note: >
      Acunado 2026-08-31 (sesion planner). El Colaborador NO se autentica: es la persona cuya
      asistencia se controla, no un usuario del sistema (decision de producto). Los roles finos
      (Programador de turnos, Aprobador) siguen vigentes: Administrador es la identidad
      autenticada que los porta.

# -------------------------
# SISTEMAS EXTERNOS
# -------------------------
external_systems:
  - name: Sistema de marcacion
    role: producer
    definition: Sistema externo (reloj biometrico u otro) que genera marcaciones y transmite Registros de Marcacion a nuestro sistema, de forma unitaria o en lotes.
    publishes_to: [ControlHoras]
    note: "Puede ser un sistema propio o del cliente. La capa de traduccion upstream convierte el formato nativo del dispositivo al Registro de Marcacion minimo."

  - name: Sistema de nomina
    role: consumer
    definition: Sistema que recibe la discriminacion de horas aprobada para calcular el pago.
    consumes_from: [ControlHoras]
    note: "El sistema de asistencia le entrega tiempo discriminado, nunca dinero. Consume DiaCalculado."

  - name: Sistema de empleados / RRHH
    role: producer
    definition: Sistema que gestiona el registro maestro de empleados (contrataciones, terminaciones, datos basicos).
    publishes_to: [Empleados]

