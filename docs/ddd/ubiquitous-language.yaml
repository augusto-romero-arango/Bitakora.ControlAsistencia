# -------------------------
# PREGUNTAS RESUELTAS
# Movidas aqui para trazabilidad
# -------------------------
resolved_questions:
  - question: "Los dominios del sistema siguen siendo correctos? Donde viven la Depuracion, la Discriminacion de horas, la Programacion?"
    context: Arquitectura
    date_asked: 2026-04-04
    date_resolved: 2026-04-15
    resolution: "Tres bounded contexts: Programacion, ControlHoras (absorbe Depuracion y CalculoHoras), Empleados."

  - question: "Reglas de inferencia de Depuracion: como se cruzan marcaciones sin TipoMarcacion con las franjas del turno para determinar entrada/salida?"
    context: ControlHoras
    date_asked: 2026-04-14
    date_resolved: 2026-04-15
    resolution: "Algoritmo secuencial por rango. Corte entre franjas = punto medio del gap. Primera marcacion es entrada, ultima es salida, intermedias se descartan."

  - question: "Lista completa de Conceptos de discriminacion. Cuales son todos los tipos que maneja la legislacion colombiana?"
    context: ControlHoras
    date_asked: 2026-04-04
    date_resolved: 2026-04-17
    resolution: >
      9 conceptos basados en CST + Ley 2466/2025: OrdinariaDiurna, OrdinariaNocturna,
      ExtraDiurna, ExtraNocturna, DominicalFestivaDiurna, DominicalFestivaNocturna,
      ExtraDiurnaDominicalFestiva, ExtraNocturnaDominicalFestiva, Descanso.
      Ejes: tipo de dia (habil/domingo-festivo), banda horaria (diurna 6AM-7PM / nocturna 7PM-6AM),
      posicion (ordinaria/extra). Banda nocturna cambio de 9PM a 7PM con Ley 2466/2025.
